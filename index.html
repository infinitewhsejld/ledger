        const usePagination = (items, initialSize = 10, resetKey = null) => {
            const [page, setPage] = React.useState(1);
            const [pageSize, setPageSize] = React.useState(initialSize);
            const total = items.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));

            // Go back to page 1 when the result set size or page size changes
            // (e.g. a filter was applied).
            React.useEffect(() => { setPage(1); }, [total, pageSize, resetKey]);

            const safePage = Math.min(page, totalPages);
            const start = (safePage - 1) * pageSize;
            const pageItems = items.slice(start, start + pageSize);

            return { page: safePage, setPage, pageSize, setPageSize, totalPages, pageItems, start, total };
        };

        const getPageNumbers = (page, totalPages) => {
            if (totalPages <= 7) return Array.from({ length: totalPages }, (_, i) => i + 1);
            const set = new Set([1, totalPages, page - 1, page, page + 1]);
            if (page <= 3) { set.add(2); set.add(3); set.add(4); }
            if (page >= totalPages - 2) { set.add(totalPages - 1); set.add(totalPages - 2); set.add(totalPages - 3); }
            const nums = Array.from(set).filter(n => n >= 1 && n <= totalPages).sort((a, b) => a - b);
            const out = [];
            nums.forEach((n, i) => {
                if (i > 0 && n - nums[i - 1] > 1) out.push('…');
                out.push(n);
            });
            return out;
        };

        const Pagination = ({ pg, label = 'records', sizes = [10, 25, 50, 100] }) => {
            if (pg.total === 0) return null;
            const from = pg.start + 1;
            const to = Math.min(pg.start + pg.pageSize, pg.total);
            const btn = "min-w-[2rem] h-8 px-2 rounded-lg text-xs font-semibold border transition-colors";
            const idle = "border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800";
            const active = "bg-indigo-600 border-indigo-600 text-white";
            const disabled = "opacity-40 cursor-not-allowed";

            return (
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 border-t border-slate-200 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400">
                    <div className="flex items-center gap-3">
                        <span>Showing <strong className="text-slate-800 dark:text-slate-200">{from}–{to}</strong> of <strong className="text-slate-800 dark:text-slate-200">{pg.total}</strong> {label}</span>
                        <label className="flex items-center gap-1.5">
                            <span>Rows:</span>
                            <select
                                value={pg.pageSize}
                                onChange={(e) => pg.setPageSize(Number(e.target.value))}
                                className="h-8 px-2 rounded-lg bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs focus:outline-none"
                            >
                                {sizes.map(n => <option key={n} value={n}>{n}</option>)}
                            </select>
                        </label>
                    </div>
                    <div className="flex items-center gap-1">
                        <button onClick={() => pg.setPage(1)} disabled={pg.page === 1} className={`${btn} ${idle} ${pg.page === 1 ? disabled : ''}`} title="First page">
                            <i className="fas fa-angles-left text-[10px]"></i>
                        </button>
                        <button onClick={() => pg.setPage(pg.page - 1)} disabled={pg.page === 1} className={`${btn} ${idle} ${pg.page === 1 ? disabled : ''}`} title="Previous page">
                            <i className="fas fa-angle-left text-[10px]"></i>
                        </button>
                        {getPageNumbers(pg.page, pg.totalPages).map((n, i) => (
                            n === '…' ? (
                                <span key={`gap-${i}`} className="px-1">…</span>
                            ) : (
                                <button key={n} onClick={() => pg.setPage(n)} className={`${btn} ${n === pg.page ? active : idle}`}>{n}</button>
                            )
                        ))}
                        <button onClick={() => pg.setPage(pg.page + 1)} disabled={pg.page === pg.totalPages} className={`${btn} ${idle} ${pg.page === pg.totalPages ? disabled : ''}`} title="Next page">
                            <i className="fas fa-angle-right text-[10px]"></i>
                        </button>
                        <button onClick={() => pg.setPage(pg.totalPages)} disabled={pg.page === pg.totalPages} className={`${btn} ${idle} ${pg.page === pg.totalPages ? disabled : ''}`} title="Last page">
                            <i className="fas fa-angles-right text-[10px]"></i>
                        </button>
                    </div>
                </div>
            );
        };

        const LedgerTable = ({ invoices, onSelectInvoice, onOpenReturnModal }) => {
            const [expandedRow, setExpandedRow] = React.useState(null);
            const pg = usePagination(invoices, 10);

            const toggleRow = (id) => {
                setExpandedRow(expandedRow === id ? null : id);
            };

            const getPaymentBadgeColor = (rawMethod) => {
                const method = String(rawMethod ?? '');
                if (method.includes('GCash')) return 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border-blue-500/20';
                if (method.includes('Maya')) return 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20';
                if (method.includes('Bank')) return 'bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border-indigo-500/20';
                if (method.includes('Cash')) return 'bg-teal-500/10 text-teal-600 dark:text-teal-400 border-teal-500/20';
                return 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-300 dark:border-slate-700';
            };

            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-slate-100/90 dark:bg-slate-950/80 text-slate-500 dark:text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-200 dark:border-slate-800">
                                <tr>
                                    <th className="py-4 px-4 w-10"></th>
                                    <th className="py-4 px-4">Invoice # & Date</th>
                                    <th className="py-4 px-4">Branch</th>
                                    <th className="py-4 px-4">Customer & TIN</th>
                                    <th className="py-4 px-4">Payment & Returns</th>
                                    <th className="py-4 px-4 text-center">BIR 2307 CWT</th>
                                    <th className="py-4 px-4 text-right">Gross Sales</th>
                                    <th className="py-4 px-4 text-right">Net Receivable</th>
                                    <th className="py-4 px-4 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200/80 dark:divide-slate-800/80">
                                {invoices.length === 0 ? (
                                    <tr>
                                        <td colSpan="9" className="py-12 text-center text-slate-600 dark:text-slate-500">
                                            <i className="fas fa-search-minus text-3xl mb-3 block text-slate-400 dark:text-slate-600"></i>
                                            No matching purchase records found.
                                        </td>
                                    </tr>
                                ) : (
                                    pg.pageItems.map((inv) => {
                                        const totals = calculateInvoiceTotals(inv);
                                        const isExpanded = expandedRow === inv.id;

                                        return (
                                            <React.Fragment key={inv.id}>
                                                <tr className={`hover:bg-slate-100/70 dark:hover:bg-slate-800/40 transition-colors ${isExpanded ? 'bg-slate-100/60 dark:bg-slate-800/30' : ''}`}>
                                                    <td className="py-4 px-4 text-center">
                                                        <button
                                                            onClick={() => toggleRow(inv.id)}
                                                            className="text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:text-indigo-400 p-1 transition-colors"
                                                            title="Expand items breakdown"
                                                        >
                                                            <i className={`fas ${isExpanded ? 'fa-chevron-down text-indigo-600 dark:text-indigo-400' : 'fa-chevron-right'}`}></i>
                                                        </button>
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        <div className="font-bold text-slate-900 dark:text-slate-100">{inv.id}</div>
                                                        <div className="text-[11px] text-slate-500 dark:text-slate-400">{inv.date}</div>
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        <span className="inline-flex items-center gap-1.5 bg-slate-100 dark:bg-slate-800 text-indigo-700 dark:text-indigo-300 border border-slate-300/80 dark:border-slate-700/80 px-2.5 py-1 rounded-lg text-[11px] font-semibold">
                                                            <i className="fas fa-store text-indigo-600 dark:text-indigo-400 text-[10px]"></i>
                                                            {inv.branch || "Main Branch"}
                                                        </span>
                                                        {inv.salesRep && (
                                                            <div className="mt-1.5 text-[10px] text-slate-500 dark:text-slate-400 flex items-center gap-1">
                                                                <i className="fas fa-user-tie text-indigo-500 dark:text-indigo-400"></i> {inv.salesRep}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        <div className="font-semibold text-slate-900 dark:text-white">{inv.customer.name}</div>
                                                        <div className="text-[11px] text-slate-500 dark:text-slate-400">{inv.customer.company}</div>
                                                        <div className="text-[10px] text-indigo-600 dark:text-indigo-400">TIN: {inv.customer.tin || 'N/A'}</div>
                                                    </td>
                                                    <td className="py-4 px-4">
                                                        <div className="flex flex-col gap-1 items-start">
                                                            <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[11px] font-medium ${getPaymentBadgeColor(inv.paymentMethod)}`}>
                                                                <i className="fas fa-credit-card text-[10px]"></i>
                                                                {inv.paymentMethod}
                                                            </span>
                                                            {totals.hasReturns && (
                                                                <span className="inline-flex items-center gap-1 bg-rose-500/10 text-rose-700 dark:text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-full text-[10px] font-semibold">
                                                                    <i className="fas fa-rotate-left"></i> {totals.totalReturnedQty} Returned
                                                                </span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="py-4 px-4 text-center">
                                                        {totals.cwtRate > 0 ? (
                                                            <span className="bg-amber-500/10 text-amber-700 dark:text-amber-300 border border-amber-500/30 font-semibold px-2 py-0.5 rounded-full text-[10px]">
                                                                {totals.cwtRate}% BIR 2307 ({formatCurrency(totals.cwtAmount)})
                                                            </span>
                                                        ) : (
                                                            <span className="text-slate-600 dark:text-slate-500">None (0%)</span>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-4 text-right">
                                                        <div className="font-bold text-slate-800 dark:text-slate-200">{formatCurrency(totals.originalGrandTotal)}</div>
                                                        {totals.totalReturnedValue > 0 && (
                                                            <div className="text-[10px] text-slate-500 dark:text-slate-400 font-medium" title="Credit notes issued from this invoice — reference only, not deducted here">{formatCurrency(totals.totalReturnedValue)} CN issued</div>
                                                        )}
                                                        {totals.creditAppliedAmount > 0 && (
                                                            <div className="text-[10px] text-rose-600 dark:text-rose-400 font-medium">-{formatCurrency(totals.creditAppliedAmount)} CN applied</div>
                                                        )}
                                                    </td>
                                                    <td className="py-4 px-4 text-right">
                                                        <div className="font-bold text-emerald-600 dark:text-emerald-400 text-sm">{formatCurrency(totals.netPayable)}</div>
                                                    </td>
                                                    <td className="py-4 px-4 text-center">
                                                        <div className="flex items-center justify-center gap-1.5">
                                                            <button
                                                                onClick={() => onSelectInvoice(inv)}
                                                                className="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-700 dark:text-indigo-300 border border-indigo-500/30 font-medium px-2.5 py-1.5 rounded-lg text-xs transition-all"
                                                                title="View Full Invoice & BIR 2307"
                                                            >
                                                                <i className="fas fa-receipt"></i> Details
                                                            </button>
                                                            <button
                                                                onClick={() => onOpenReturnModal(inv)}
                                                                className="bg-rose-600/20 hover:bg-rose-600/40 text-rose-700 dark:text-rose-300 border border-rose-500/30 font-medium px-2.5 py-1.5 rounded-lg text-xs transition-all"
                                                                title="Process Item Return"
                                                            >
                                                                <i className="fas fa-rotate-left"></i> Return
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>

                                                {/* Expanded Inline Line-Items Breakdown */}
                                                {isExpanded && (
                                                    <tr className="bg-slate-100 dark:bg-slate-950/90">
                                                        <td colSpan="9" className="p-4 sm:p-6 border-y border-slate-200 dark:border-slate-800">
                                                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4">
                                                                <div className="flex items-center justify-between mb-3">
                                                                    <h4 className="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider flex items-center gap-2">
                                                                        <i className="fas fa-list"></i> Itemized Products Breakdown for {inv.id}
                                                                    </h4>
                                                                    <div className="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-3">
                                                                        <span>Branch: <strong className="text-slate-800 dark:text-slate-200">{inv.branch || 'Main Branch'}</strong></span>
                                                                        <span>Payment: <strong className="text-slate-800 dark:text-slate-200">{inv.paymentMethod}</strong></span>
                                                                    </div>
                                                                </div>

                                                                <div className="overflow-x-auto">
                                                                    <table className="w-full text-left text-xs">
                                                                        <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                                                                            <tr>
                                                                                <th className="py-2 px-3">Product Name</th>
                                                                                <th className="py-2 px-2">Category</th>
                                                                                <th className="py-2 px-2 text-right">Unit Price (₱)</th>
                                                                                <th className="py-2 px-2 text-center">Qty Bought / Returned</th>
                                                                                <th className="py-2 px-2 text-right">Discount</th>
                                                                                <th className="py-2 px-3 text-right">Net Subtotal</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody className="divide-y divide-slate-200/60 dark:divide-slate-800/50">
                                                                            {inv.items.map((item, idx) => {
                                                                                const retQty = item.returnedQty || 0;
                                                                                const lineDiscount = calculateItemDiscountAmount(item, false);
                                                                                const lineNet = calculateItemNet(item, false);

                                                                                return (
                                                                                    <tr key={idx} className={`hover:bg-slate-100/60 dark:hover:bg-slate-800/30 ${retQty > 0 ? 'bg-rose-50/70 dark:bg-rose-950/10' : ''}`}>
                                                                                        <td className="py-2.5 px-3">
                                                                                            <span className="font-medium text-slate-800 dark:text-slate-200">{item.name}</span>
                                                                                            <span className="block text-[10px] text-slate-600 dark:text-slate-500">SKU: {item.sku}</span>
                                                                                        </td>
                                                                                        <td className="py-2.5 px-2 text-slate-500 dark:text-slate-400">{item.category}</td>
                                                                                        <td className="py-2.5 px-2 text-right text-slate-700 dark:text-slate-300">{formatCurrency(item.unitPrice)}</td>
                                                                                        <td className="py-2.5 px-2 text-center text-slate-900 dark:text-white font-semibold">
                                                                                            {item.qty}
                                                                                            {retQty > 0 && (
                                                                                                <span className="block text-[10px] text-rose-600 dark:text-rose-400 font-semibold">
                                                                                                    ({retQty} returned)
                                                                                                </span>
                                                                                            )}
                                                                                        </td>
                                                                                        <td className="py-2.5 px-2 text-right">
                                                                                            {item.discountPercent > 0 ? (
                                                                                                <span className="text-emerald-600 dark:text-emerald-400 font-medium">
                                                                                                    {item.discountPercent}%
                                                                                                </span>
                                                                                            ) : (
                                                                                                <span className="text-slate-400 dark:text-slate-600">None</span>
                                                                                            )}
                                                                                        </td>
                                                                                        <td className="py-2.5 px-3 text-right font-bold text-indigo-700 dark:text-indigo-300">
                                                                                            {formatCurrency(lineNet)}
                                                                                        </td>
                                                                                    </tr>
                                                                                );
                                                                            })}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>
                    <Pagination pg={pg} label="invoices" />
                </div>
            );
        };

        // ---- Customer reports -------------------------------------------------
        // To add a new report later, just add one object to this list:
        //   key     unique id
        //   label   button text          icon  Font Awesome class
        //   filter  (optional) keep only customers where this returns true
        //   sort    (optional) comparator, e.g. (a, b) => b.x - a.x
        //   metric  (optional) text shown on each card's rank strip
        const topReturnedItemOf = (c) => {
            const entries = Object.entries(c.returnedByItem || {}).sort((a, b) => b[1] - a[1]);
            return entries.length ? { name: entries[0][0], qty: entries[0][1] } : null;
        };

        const CUSTOMER_REPORTS = [
            { key: 'all', label: 'All Customers', icon: 'fa-users' },
            {
                key: 'topSpend', label: 'Top Net Spend', icon: 'fa-sack-dollar',
                sort: (a, b) => b.totalNetReceivable - a.totalNetReceivable,
                metric: (c) => formatCurrency(c.totalNetReceivable)
            },
            {
                key: 'topReturns', label: 'Top Returned Items', icon: 'fa-rotate-left',
                filter: (c) => c.totalReturnedItemsCount > 0,
                sort: (a, b) => b.totalReturnedItemsCount - a.totalReturnedItemsCount,
                metric: (c) => {
                    const top = topReturnedItemOf(c);
                    return `${c.totalReturnedItemsCount} units returned` + (top ? ` · most: ${top.name} (${top.qty})` : '');
                }
            }
        ];

        const CustomerLedgerView = ({ invoices, onSelectInvoice, creditNotesByEmail = {}, customersById = {} }) => {
            const customerMap = React.useMemo(() => {
                const map = {};
                invoices.forEach(inv => {
                    // Preferred, reliable path: the invoice is linked to a real row in the
                    // `customers` table via customer_id — group on that id directly, and
                    // display that customer's canonical name/company/tin (not whatever text
                    // happened to be typed on this particular invoice).
                    //
                    // Legacy fallback (for invoices saved before this link existed): match by
                    // email, then by name. If there's truly no identifying info at all, don't
                    // lump the invoice into one shared "no-name" bucket with every other
                    // unidentified sale — key it by its own invoice id so it gets its own card
                    // instead of merging with unrelated customers.
                    const matchKey = getCreditMatchKey(inv.customer || {});
                    const phone = (inv.customer?.phone || '').trim().toLowerCase();
                    const key = inv.customerId
                        ? `id:${inv.customerId}`
                        : (matchKey || (phone ? `phone:${phone}` : `unknown:${inv.id}`));
                    if (!map[key]) {
                        const canonicalCustomer = inv.customerId && customersById[inv.customerId]
                            ? customersById[inv.customerId]
                            : inv.customer;
                        map[key] = {
                            customer: canonicalCustomer,
                            invoices: [],
                            totalGross: 0,
                            totalReturns: 0,
                            totalNetReceivable: 0,
                            totalItemsCount: 0,
                            totalReturnedItemsCount: 0,
                            returnedByItem: {},
                            creditBalance: creditNotesByEmail[matchKey] || 0
                        };
                    }
                    const totals = calculateInvoiceTotals(inv);
                    map[key].invoices.push(inv);
                    map[key].totalGross += totals.originalGrandTotal;
                    map[key].totalReturns += totals.totalReturnedValue;
                    map[key].totalNetReceivable += totals.netPayable;
                    map[key].totalItemsCount += totals.totalQty;
                    map[key].totalReturnedItemsCount += totals.totalReturnedQty;
                    (inv.items || []).forEach(it => {
                        if (it.returnedQty > 0) {
                            map[key].returnedByItem[it.name] = (map[key].returnedByItem[it.name] || 0) + it.returnedQty;
                        }
                    });
                });
                return Object.values(map);
            }, [invoices, creditNotesByEmail]);

            const [reportKey, setReportKey] = React.useState('all');
            const report = CUSTOMER_REPORTS.find(r => r.key === reportKey) || CUSTOMER_REPORTS[0];

            const visibleCustomers = React.useMemo(() => {
                let list = customerMap;
                if (report.filter) list = list.filter(report.filter);
                if (report.sort) list = [...list].sort(report.sort);
                return list;
            }, [customerMap, report]);

            const pg = usePagination(visibleCustomers, 12, reportKey);

            return (
                <div className="space-y-6">
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xl">
                        <h2 className="text-base font-bold font-display text-slate-900 dark:text-white flex items-center gap-2 mb-2">
                            <i className="fas fa-users text-indigo-600 dark:text-indigo-400"></i> Customer Purchase Ledger Summary
                        </h2>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">Aggregated customer purchasing history, returns, and total net revenue per client.</p>

                        <div className="flex flex-wrap items-center gap-2 mb-5">
                            {CUSTOMER_REPORTS.map(r => (
                                <button
                                    key={r.key}
                                    onClick={() => setReportKey(r.key)}
                                    className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-semibold transition-colors ${
                                        reportKey === r.key
                                            ? 'bg-indigo-600 border-indigo-600 text-white'
                                            : 'border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                                    }`}
                                >
                                    <i className={`fas ${r.icon} text-[10px]`}></i> {r.label}
                                </button>
                            ))}
                        </div>

                        {visibleCustomers.length === 0 && (
                            <div className="py-10 text-center text-xs text-slate-500 dark:text-slate-400">No customers match this report.</div>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {pg.pageItems.map((cData, idx) => (
                                <div key={pg.start + idx} className="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-5 hover:border-slate-300 dark:hover:border-slate-700 transition-all flex flex-col justify-between">
                                    <div>
                                        {report.metric && (
                                            <div className="flex items-center justify-between gap-3 mb-3 px-2.5 py-1.5 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-[11px] font-semibold text-indigo-700 dark:text-indigo-300">
                                                <span>#{pg.start + idx + 1}</span>
                                                <span className="text-right">{report.metric(cData)}</span>
                                            </div>
                                        )}
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <h3 className="text-sm font-bold text-slate-900 dark:text-white">
                                                    {cData.customer.name || (
                                                        <span className="italic text-slate-400 dark:text-slate-600">Unnamed Customer</span>
                                                    )}
                                                </h3>
                                                {cData.customer.company && (
                                                    <p className="text-xs text-indigo-600 dark:text-indigo-400 font-medium">{cData.customer.company}</p>
                                                )}
                                                {!cData.customer.name && !cData.customer.company && (
                                                    <p className="text-[10px] text-slate-400 dark:text-slate-600">No name on file for this invoice — edit it in Supabase to fix grouping.</p>
                                                )}
                                            </div>
                                            <span className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-300 dark:border-slate-700">
                                                {cData.invoices.length} Invoices
                                            </span>
                                        </div>

                                        <div className="space-y-1.5 text-xs text-slate-500 dark:text-slate-400 my-4 bg-slate-50 dark:bg-slate-900/60 p-3 rounded-lg border border-slate-200 dark:border-slate-800">
                                            <div className="flex justify-between">
                                                <span>TIN:</span>
                                                <span className="text-slate-800 dark:text-slate-200 font-mono text-[11px]">{cData.customer.tin || 'N/A'}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span>Items Purchased:</span>
                                                <span className="text-slate-800 dark:text-slate-200 font-bold">{cData.totalItemsCount} units</span>
                                            </div>
                                            {cData.totalReturnedItemsCount > 0 && (
                                                <div className="flex justify-between text-slate-600 dark:text-slate-400 font-semibold">
                                                    <span>Items Returned (Credit Notes Issued):</span>

        const CreditNotesView = ({ creditNotes, invoices, onSelectInvoice }) => {

        // Per-sales-rep performance, built from whatever invoices the filters currently allow
