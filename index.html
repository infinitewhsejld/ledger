    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // "Tidal Light" theme: the app's existing markup already uses Tailwind's
        // `indigo` (primary accent) and `violet` (gradient end-stop) color names
        // throughout — buttons, active tabs, links, focus rings, icon badges.
        // Rather than touch every className, we repoint those two palettes at a
        // custom teal → aqua → warm-gold ramp (like light breaking on shallow
        // water), so the whole app re-skins consistently in one place.
        // `indigo` = the deep-tide teal (primary brand accent).
        // `violet` = repurposed as the warm gold "sun-glint" — only used as a
        // gradient end-stop in a couple of spots (logo badge, primary CTA).
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0FDFA', 100: '#DFFAF3', 500: '#17A2AD',
                            600: '#0E7C86', 700: '#0B4A54', 900: '#052A33',
                        },
                        indigo: {
                            50: '#F0FDFA', 100: '#DFFAF3', 200: '#B4EFE3', 300: '#7FDFD4',
                            400: '#3FBFC4', 500: '#17A2AD', 600: '#0E7C86', 700: '#0B4A54',
                            800: '#073A44', 900: '#052A33', 950: '#031B20',
                        },
                        violet: {
                            50: '#FFFBEB', 100: '#FEF3C7', 200: '#FDE68A', 300: '#FCD34D',
                            400: '#FBBF24', 500: '#FFC857', 600: '#E8A63C', 700: '#C6841F',
                            800: '#9C6218', 900: '#7A4C14', 950: '#452A0A',
                        },
                    },
                    fontFamily: {
                        display: ['Sora', 'sans-serif'],
                    },
                }
            }
        }
    </script>

            window.addEventListener('afterprint', function () {

                date: "2026-08-15",
                paymentMethod: "Maya",
                status: "Pending",
                taxRate: 12.0,
                cwt2307Rate: 2.0,
                atcCode: "WC160",
                notes: "Pending BIR Form 2307 submission.",
                items: [
                    { id: "P101", name: "UltraWide 34\" Curved Monitor", sku: "MON-UW34", category: "Electronics", unitPrice: 38500.00, qty: 1, discountPercent: 5, returnedQty: 0 },
                    { id: "P110", name: "HD Pro Webcam 4K", sku: "CAM-4K01", category: "Electronics", unitPrice: 9200.00, qty: 1, discountPercent: 10, returnedQty: 0 }
                ],
                returns: []
            }
        ];

        // =====================================================================
        // Supabase connection
        // =====================================================================
        const SUPABASE_URL = "https://zjlitbpphuzhkcdvcixc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Is1KJw0lCqgCIC4_y2moUw_LfnG1Pqw";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Pulls EVERY row, 1000 at a time (Supabase returns max 1000 rows per request).
        // `buildQuery` must return a fresh query each call and end with a unique order
        // column (id) so pages never skip or duplicate rows.
        const fetchAllRows = async (buildQuery) => {
            const pageSize = 1000;
            let from = 0;
            let all = [];
            while (true) {
                const { data, error } = await buildQuery().range(from, from + pageSize - 1);
                if (error) throw new Error(error.message);
                all = all.concat(data || []);
                if (!data || data.length < pageSize) break;
                from += pageSize;
            }
            return all;
        };

        
        // Maps a Supabase invoice row (with invoice_items→products and returns
        // joined in) into the exact shape the rest of this app already expects
        // (nested `customer` object, `items` array, `returns` array) — same
        // shape the Apps Script backend used to hand back, so no other
        // component needs to change.
        const mapSupabaseInvoice = (row) => ({
            id: row.id,
            branch: row.branch,
            customerId: row.customer_id || null,
            // Customer details now come from the joined `customers` row (via
            // customer_id) instead of denormalized text columns on invoices —
            // those columns (customer_name/email/phone/company/tin) were
            // dropped once every invoice was linked to a real customer record.
            customer: {
                name: row.customer?.name || '',
                email: row.customer?.email || '',
                phone: row.customer?.phone || '',
                company: row.customer?.company || '',
                tin: row.customer?.tin || ''
            },
            date: row.invoice_date,
            paymentMethod: row.payment_method || 'Unspecified',
            status: row.status,
            taxRate: Number(row.tax_rate) || 0,
            cwt2307Rate: Number(row.cwt_2307_rate) || 0,
            atcCode: row.atc_code,
            notes: row.notes,
            salesRep: row.sales_rep || '',
            items: (row.invoice_items || []).map(ii => ({
                id: ii.id, // invoice_items.id (uuid) — unique per line, used for return selection
                productId: ii.product_id,
                name: ii.products?.name || '(Unknown Item)',
                sku: ii.products?.sku || '',
                category: ii.products?.category || 'General',
                unitPrice: Number(ii.unit_price) || 0,
                qty: ii.qty,
                discountPercent: Number(ii.discount_percent) || 0,
                returnedQty: ii.returned_qty || 0
            })),
            returns: (row.returns || []).map(r => ({
                id: r.id,
                date: r.return_date,
                itemId: r.invoice_item_id,
                itemName: r.invoice_items?.products?.name || '',
                qty: r.qty,
                unitPrice: Number(r.unit_price) || 0,
                discountPercent: Number(r.discount_percent) || 0,
                reason: r.reason,
                refundMethod: r.refund_method,
                creditNoteNo: r.credit_note_no,
                remarks: r.remarks,
                // Redemption history: each entry is { invoiceId, amount, date } recording
                // a later invoice this credit note's balance was applied against.
                // Requires a `applications jsonb default '[]'` column on `returns` — see migration notes.
                applications: r.applications || []
            }))
        });

        // Fetches invoices with customer/branches/items/products/returns joined in,
        // then reshapes them into the format the rest of the app expects. The
        // `customer:customers!customer_id ( * )` embed pulls the linked customer
        // row (name/email/phone/company/tin) through the customer_id foreign key.
        const fetchInvoicesFromSupabase = async () => {
            const data = await fetchAllRows(() => sb
                .from('invoices')
                .select(`
                    *,
                    customer:customers!customer_id ( * ),
                    invoice_items ( *, products ( * ) ),
                    returns ( *, invoice_items ( *, products ( * ) ) )
                `)
                .order('invoice_date', { ascending: false })
                .order('id', { ascending: false }));
            return data.map(mapSupabaseInvoice);
        };

        // Finds an existing product by SKU (so repeat products don't get
        // duplicated in the catalog) or creates a new one, returning its id.
        const getOrCreateProductId = async (item) => {
            if (item.sku) {
                const { data: existing, error: findErr } = await sb
                    .from('products')
                    .select('id')
                    .eq('sku', item.sku)
                    .maybeSingle();
                if (findErr) throw new Error(findErr.message);
                if (existing) return existing.id;
            }
            const newId = item.id || `P-${Math.floor(100000 + Math.random() * 900000)}`;
            const { error: insertErr } = await sb
                .from('products')
                .insert({ id: newId, name: item.name, sku: item.sku || null, category: item.category || 'General' });
            if (insertErr) throw new Error(insertErr.message);
            return newId;
        };

        // Fetches the full product catalog (for the item autocomplete in the
        // new-transaction form) — independent of which invoices are loaded,
        // so items only used on filtered-out invoices still show up.
        const fetchProductsFromSupabase = () =>
            fetchAllRows(() => sb.from('products').select('*')
                .order('name', { ascending: true })
                .order('id', { ascending: true }));

        // Fetches the full customer catalog (for the customer autocomplete in the
        // new-transaction form + the Customer Profiles tab) — independent of which
        // invoices are loaded, so customers only tied to filtered-out invoices still show up.
        const fetchCustomersFromSupabase = async () => {
            const rows = await fetchAllRows(() => sb.from('customers').select('*')
                .order('name', { ascending: true })
                .order('id', { ascending: true }));
            return rows.map(c => ({
                id: c.id,
                name: c.name,
                email: c.email || '',
                phone: c.phone || '',
                company: c.company || '',
                tin: c.tin || ''
            }));
        };

        // Generates the next sequential CUST-00001-style id by looking at the
        // highest existing numeric suffix already in the table. Not
        // collision-proof under heavy concurrent writes, but this is a
        // low-traffic internal tool (one sale logged at a time), so a
        // fresh read right before insert is good enough in practice.
        const generateNextCustomerId = async () => {
            const { data, error } = await sb
                .from('customers')
                .select('id')
                .ilike('id', 'CUST-%')
                .order('id', { ascending: false })
                .limit(1);
            if (error) throw new Error(error.message);
            const lastId = data && data[0] ? data[0].id : null;
            const lastNum = lastId ? parseInt(lastId.replace(/^CUST-/i, ''), 10) || 0 : 0;
            return `CUST-${String(lastNum + 1).padStart(5, '0')}`;
        };

        // Keeps the `customers` table in sync whenever a sale is logged: finds an existing
        // customer by email (or by name, for walk-ins without an email), updates their
        // details, and returns their id — or creates a brand-new CUST-00001-style row (and
        // returns that new id) if this is their first time. The returned id is what gets
        // saved on the invoice as `customer_id`, so every invoice for the same person links
        // to the same customer record instead of relying on their name matching exactly.
        const upsertCustomerToSupabase = async (customer) => {
            const email = (customer.email || '').trim();
            const name = (customer.name || '').trim();
            if (!name) return null;

            let existing = null;
            if (email) {
                const { data, error } = await sb
                    .from('customers')
                    .select('id')
                    .ilike('email', email)
                    .maybeSingle();
                if (error) throw new Error(error.message);
                existing = data;
            } else {
                const { data, error } = await sb
                    .from('customers')
                    .select('id')
                    .ilike('name', name)
                    .is('email', null)
                    .maybeSingle();
                if (error) throw new Error(error.message);
                existing = data;
            }

            const payload = {
                name,
                email: email || null,
                phone: customer.phone || null,
                company: customer.company || null,
                tin: customer.tin || null
            };

            if (existing) {
                const { error } = await sb.from('customers').update(payload).eq('id', existing.id);
                if (error) throw new Error(error.message);
                return existing.id;
            } else {
                const newId = await generateNextCustomerId();
                const { error } = await sb.from('customers').insert({ id: newId, ...payload });
                if (error) throw new Error(error.message);
                return newId;
            }
        };

        // Persists a brand-new invoice: ensures the branch exists, inserts the
        // invoice row, then resolves/creates a product per line item and
        // inserts the invoice_items rows.
        const insertInvoiceToSupabase = async (newInv, customerId = null) => {
            const { error: branchErr } = await sb
                .from('branches')
                .upsert({ name: newInv.branch }, { onConflict: 'name', ignoreDuplicates: true });
            if (branchErr) throw new Error(branchErr.message);

            const { error: invErr } = await sb.from('invoices').insert({
                id: newInv.id,
                branch: newInv.branch,
                customer_id: customerId,
                invoice_date: newInv.date,
                payment_method: newInv.paymentMethod,
                status: newInv.status,
                tax_rate: newInv.taxRate,
                cwt_2307_rate: newInv.cwt2307Rate,
                atc_code: newInv.atcCode,
                notes: newInv.notes || null,
                ...(newInv.salesRep ? { sales_rep: newInv.salesRep } : {})
            });
            if (invErr) throw new Error(invErr.message);

            for (const item of newInv.items) {
                const productId = await getOrCreateProductId(item);
                const { error: itemErr } = await sb.from('invoice_items').insert({
                    invoice_id: newInv.id,
                    product_id: productId,
                    unit_price: item.unitPrice,
                    qty: item.qty,
                    discount_percent: item.discountPercent || 0,
                    returned_qty: 0
                });
                if (itemErr) throw new Error(itemErr.message);
            }
        };

        // Changes whether BIR 2307 (creditable withholding tax) applies to an existing invoice.
        // rate 0 = not applicable. Admin-only in the UI; also enforce it with a Supabase RLS policy.
        const updateCwt2307InSupabase = async (invoiceId, rate, atcCode) => {
            const { error } = await sb.from('invoices')
                .update({ cwt_2307_rate: rate, atc_code: rate > 0 ? (atcCode || null) : 'N/A' })
                .eq('id', invoiceId);
            if (error) throw new Error(error.message);
        };

        // Sets (or clears) the sales representative on an existing invoice.
        const updateSalesRepInSupabase = async (invoiceId, salesRep) => {
            const { error } = await sb.from('invoices').update({ sales_rep: salesRep || null }).eq('id', invoiceId);
            if (error) throw new Error(error.message);
        };

        // Persists a return: inserts the return row, bumps returned_qty on the
        // invoice_items row it applies to, then recomputes the invoice status.
        const insertReturnToSupabase = async (invoiceId, invoiceItemId, qtyToReturn, returnRecord) => {
            const { error: retErr } = await sb.from('returns').insert({
                id: returnRecord.id,
                invoice_id: invoiceId,
                invoice_item_id: invoiceItemId,
                return_date: returnRecord.date,
                qty: qtyToReturn,
                unit_price: returnRecord.unitPrice,
                discount_percent: returnRecord.discountPercent,
                reason: returnRecord.reason,
                refund_method: returnRecord.refundMethod,
                credit_note_no: returnRecord.creditNoteNo,
                remarks: returnRecord.remarks
            });
            if (retErr) throw new Error(retErr.message);

            const { data: itemRow, error: fetchErr } = await sb
                .from('invoice_items')
                .select('returned_qty')
                .eq('id', invoiceItemId)
                .single();
            if (fetchErr) throw new Error(fetchErr.message);

            const { error: updateErr } = await sb
                .from('invoice_items')
                .update({ returned_qty: (itemRow.returned_qty || 0) + qtyToReturn })
                .eq('id', invoiceItemId);
            if (updateErr) throw new Error(updateErr.message);

            const { data: invRow, error: invFetchErr } = await sb
                .from('invoices')
                .select('status')
                .eq('id', invoiceId)
                .single();
            if (invFetchErr) throw new Error(invFetchErr.message);

            const baseStatus = (invRow.status || 'Paid').replace(' (Partially Returned)', '');
            const newStatus = `${baseStatus} (Partially Returned)`;
            if (invRow.status !== newStatus) {
                const { error: statusErr } = await sb
                    .from('invoices')
                    .update({ status: newStatus })
                    .eq('id', invoiceId);
                if (statusErr) throw new Error(statusErr.message);
            }
        };

        // A credit note's face value (VAT-inclusive), computed the same way regardless of
        // whether it came fresh from ProcessReturnModal or back from Supabase.
        // A refund paid out as Cash / GCash / Bank leaves the business immediately, so it
        // reduces Net Cash Receivable and can never be redeemed again as credit.
        // Only "Store Credit / Credit Memo" stays as a redeemable credit note.
        const isCashRefund = (method) => !!method && !/^store credit/i.test(String(method).trim());

        const calculateCreditNoteValue = (ret) => (ret.qty || 0) * (ret.unitPrice || 0) * (1 - ((ret.discountPercent || 0) / 100));

        // Builds the identifier used to match a customer to their credit notes. Most
        // walk-in / parish / individual buyers never give an email, so we can't require
        // one: prefer the email when it's a real one, otherwise fall back to the
        // normalized customer name so credit notes still match up by name alone.
        const normalizeCustomerName = (name) => (name || '').trim().toLowerCase().replace(/\s+/g, ' ');

        const getCreditMatchKey = (customer) => {
            const email = (customer?.email || '').trim().toLowerCase();
            const hasValidEmail = email && email !== 'n/a';
            if (hasValidEmail) return `email:${email}`;
            const name = normalizeCustomerName(customer?.name);
            return name ? `name:${name}` : '';
        };

        // Applies (redeems) an existing credit note's balance against a different, later
        // invoice: reads the credit note's current applications, appends this redemption,
        // and writes it back. Does NOT touch the origin invoice — that invoice's total is
        // never reduced by its own returns; only the invoice the credit note is redeemed
        // against gets the deduction (via creditAppliedAmount, computed client-side from
        // every return's `applications` array).
        const applyCreditNoteToInvoice = async (creditNoteId, invoiceId, amount, dateStr) => {
            const { data: cnRow, error: fetchErr } = await sb
                .from('returns')
                .select('applications')
                .eq('id', creditNoteId)
                .single();
            if (fetchErr) throw new Error(fetchErr.message);

            const applications = Array.isArray(cnRow.applications) ? cnRow.applications : [];
            applications.push({ invoiceId, amount, date: dateStr });

            const { error: updateErr } = await sb
                .from('returns')
                .update({ applications })
                .eq('id', creditNoteId);
            if (updateErr) throw new Error(updateErr.message);
        };

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP', minimumFractionDigits: 2 }).format(amount || 0);
        };

        const calculateItemNet = (item, accountForReturns = false) => {
            const qty = accountForReturns ? Math.max(0, item.qty - (item.returnedQty || 0)) : item.qty;
            const gross = qty * item.unitPrice;
            const discountAmt = gross * ((item.discountPercent || 0) / 100);
            return gross - discountAmt;
        };

        const calculateItemDiscountAmount = (item, accountForReturns = false) => {
            const qty = accountForReturns ? Math.max(0, item.qty - (item.returnedQty || 0)) : item.qty;
            return (qty * item.unitPrice) * ((item.discountPercent || 0) / 100);
        };

        const calculateInvoiceTotals = (invoice) => {
            // NOTE: item.unitPrice is VAT-INCLUSIVE (gross price already contains the 12% VAT).
            // So VAT must be *extracted* (backed out) from the inclusive amount, never added on top.
            const rate = invoice.taxRate || 0;
            const vatDivisor = 1 + (rate / 100);

            // Original Purchased Amounts (VAT-inclusive basis) — this is what the customer was
            // actually billed on THIS invoice. Item returns issued against this invoice do NOT
            // reduce it: a credit note is a separate instrument, only ever redeemed against
            // whichever later invoice it gets applied to (see creditAppliedAmount below).
            const originalSubtotal = invoice.items.reduce((sum, item) => sum + (item.qty * item.unitPrice), 0);
            const originalDiscount = invoice.items.reduce((sum, item) => sum + calculateItemDiscountAmount(item, false), 0);
            const originalNetInclusive = originalSubtotal - originalDiscount; // amount actually charged, VAT-inclusive
            const originalGrandTotal = originalNetInclusive; // Total charged already includes VAT — no re-adding tax

            const netInclusive = originalNetInclusive; // Invoiced amount, unaffected by returns issued against it
            const tax = netInclusive - (netInclusive / vatDivisor); // VAT portion embedded in the invoiced amount
            const netSubtotal = netInclusive - tax; // Net Sales excluding VAT (VAT-exclusive base)
            const grandTotal = netInclusive; // Invoiced Total — equals netSubtotal + tax, VAT not added twice

            // Reference-only figure: total face value of credit notes issued FROM returns on
            // this invoice. Informational — does not reduce this invoice's own total.
            const returnedSubtotal = invoice.items.reduce((sum, item) => sum + ((item.returnedQty || 0) * item.unitPrice), 0);
            const returnedDiscount = invoice.items.reduce((sum, item) => {
                const retQty = item.returnedQty || 0;
                return sum + (retQty * item.unitPrice * ((item.discountPercent || 0) / 100));
            }, 0);
            const returnedNetInclusive = returnedSubtotal - returnedDiscount; // VAT-inclusive value of returned items
            const returnedTax = returnedNetInclusive - (returnedNetInclusive / vatDivisor); // VAT portion of returned amount
            const totalReturnedValue = returnedNetInclusive; // Credit Notes Issued (reference only — see note above)

            // Credit note(s) redeemed AGAINST this invoice (issued from returns on some other,
            // earlier invoice, then applied here when the customer bought again). This is the
            // only way a credit note reduces an invoice's payable amount.
            const creditAppliedAmount = invoice.creditAppliedAmount || 0;

            // BIR 2307 Calculation: Creditable Withholding Tax (CWT) applied on the VAT-exclusive
            // Net Sales base of what was actually invoiced (also unaffected by returns).
            const cwtRate = invoice.cwt2307Rate || 0;
            const cwtAmount = netSubtotal * (cwtRate / 100);
            // Cash / GCash / Bank refunds already paid out for returns on this invoice.
            const cashRefundedAmount = (invoice.returns || []).reduce(
                (sum, r) => isCashRefund(r.refundMethod) ? sum + calculateCreditNoteValue(r) : sum, 0);
            const netPayable = grandTotal - cwtAmount - creditAppliedAmount - cashRefundedAmount; // Cash kept after CWT, redeemed credit notes and cash refunds

            const totalQty = invoice.items.reduce((sum, item) => sum + item.qty, 0);
            const totalReturnedQty = invoice.items.reduce((sum, item) => sum + (item.returnedQty || 0), 0);
            const activeQty = totalQty - totalReturnedQty;

            return {
                originalSubtotal,
                originalDiscount,
                originalGrandTotal,
                returnedSubtotal,
                returnedDiscount,
                returnedNetSubtotal: returnedNetInclusive,
                returnedTax,
                totalReturnedValue,
                subtotal: originalSubtotal,
                totalDiscount: originalDiscount,
                netSubtotal,
                tax,
                grandTotal,
                cwtRate,
                cwtAmount,
                creditAppliedAmount,
                cashRefundedAmount,
                appliedCreditNotes: invoice.appliedCreditNotes || [],
                netPayable,
                totalQty,
                totalReturnedQty,
                activeQty,
                hasReturns: totalReturnedQty > 0 || (invoice.returns && invoice.returns.length > 0)
            };
        };

                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 relative overflow-hidden group hover:border-slate-300 dark:hover:border-slate-700 transition-all">
                        <div className="flex items-center justify-between">
                            <div>
                                <p className="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Net Cash Receivable</p>
                                <h3 className="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{formatCurrency(totalNetReceivable)}</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400 mt-2">
                                    Net of 2307 withholding, credit notes applied{refundsPaid > 0 ? ` & ${formatCurrency(refundsPaid)} cash refunds` : ' & cash refunds'}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
            );
        };

        const BranchBreakdown = ({ invoices, branches, activeBranch, onSelectBranch }) => {
            const [open, setOpen] = React.useState(false);

            const rows = branches.map(b => {
                const branchInvoices = invoices.filter(inv => inv.branch === b);
                const gross = branchInvoices.reduce((acc, inv) => acc + calculateInvoiceTotals(inv).originalGrandTotal, 0);
                const returns = branchInvoices.reduce((acc, inv) => acc + calculateInvoiceTotals(inv).totalReturnedValue, 0);
                const cwt = branchInvoices.reduce((acc, inv) => acc + calculateInvoiceTotals(inv).cwtAmount, 0);
                const net = branchInvoices.reduce((acc, inv) => acc + calculateInvoiceTotals(inv).netPayable, 0);
                return { branch: b, count: branchInvoices.length, gross, returns, cwt, net };
            }).filter(r => r.count > 0);

            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl mb-6 shadow-md overflow-hidden">
                    <button

                        className="w-full flex items-center justify-between px-5 py-4 text-left hover:bg-slate-100/80 dark:hover:bg-slate-800/50 transition-colors"

                        <span className="text-sm font-semibold text-slate-800 dark:text-slate-200 flex items-center gap-2">

                            Compare All Branches Side-by-Side
                        </span>
                        <i className={`fas fa-chevron-${open ? 'up' : 'down'} text-slate-500 dark:text-slate-400 text-xs`}></i>
                    </button>
                    {open && (
                        <div className="overflow-x-auto custom-scrollbar border-t border-slate-200 dark:border-slate-800">
                            <table className="w-full text-sm">
                                <thead>
                                    <tr className="bg-slate-100/70 dark:bg-slate-950/50 text-slate-500 dark:text-slate-400 text-xs uppercase tracking-wider">
                                        <th className="py-3 px-4 text-left">Branch</th>
                                        <th className="py-3 px-4 text-right">Records</th>
                                        <th className="py-3 px-4 text-right">Gross Invoiced Sales</th>
                                        <th className="py-3 px-4 text-right">Item Returns & Credit Notes</th>
                                        <th className="py-3 px-4 text-right">BIR 2307 Tax Withheld</th>
                                        <th className="py-3 px-4 text-right">Net Cash Receivable</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.map(r => (
                                        <tr
                                            key={r.branch}
                                            onClick={() => onSelectBranch(r.branch)}
                                            className={`border-t border-slate-200/70 dark:border-slate-800/60 cursor-pointer hover:bg-slate-100/70 dark:hover:bg-slate-800/40 transition-colors ${activeBranch === r.branch ? 'bg-indigo-500/10' : ''}`}
                                        >

                                            <td className="py-3 px-4 text-right text-slate-500 dark:text-slate-400">{r.count}</td>
                                            <td className="py-3 px-4 text-right text-slate-900 dark:text-white font-medium">{formatCurrency(r.gross)}</td>
                                            <td className="py-3 px-4 text-right text-rose-600 dark:text-rose-400">{formatCurrency(r.returns)}</td>
                                            <td className="py-3 px-4 text-right text-amber-600 dark:text-amber-400">{formatCurrency(r.cwt)}</td>
                                            <td className="py-3 px-4 text-right text-emerald-600 dark:text-emerald-400 font-semibold">{formatCurrency(r.net)}</td>
                                        </tr>
