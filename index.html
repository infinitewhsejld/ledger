                                </tbody>
                                <tfoot>
                                    <tr className="border-t-2 border-slate-300 dark:border-slate-700 bg-slate-100/60 dark:bg-slate-950/40 font-semibold">
                                        <td className="py-3 px-4 text-slate-800 dark:text-slate-200">All Branches</td>
                                        <td className="py-3 px-4 text-right text-slate-700 dark:text-slate-300">{rows.reduce((a, r) => a + r.count, 0)}</td>
                                        <td className="py-3 px-4 text-right text-slate-900 dark:text-white">{formatCurrency(rows.reduce((a, r) => a + r.gross, 0))}</td>
                                        <td className="py-3 px-4 text-right text-rose-600 dark:text-rose-400">{formatCurrency(rows.reduce((a, r) => a + r.returns, 0))}</td>
                                        <td className="py-3 px-4 text-right text-amber-600 dark:text-amber-400">{formatCurrency(rows.reduce((a, r) => a + r.cwt, 0))}</td>
                                        <td className="py-3 px-4 text-right text-emerald-600 dark:text-emerald-400">{formatCurrency(rows.reduce((a, r) => a + r.net, 0))}</td>
                                    </tr>
                                </tfoot>
                            </table>
                            <p className="text-xs text-slate-600 dark:text-slate-500 px-4 py-3 border-t border-slate-200/70 dark:border-slate-800/60">
                                <i className="fas fa-circle-info mr-1"></i> Click a row to filter the whole page by that branch.
                            </p>
                        </div>
                    )}
                </div>
            );
        };

        // Local-time YYYY-MM-DD (toISOString() is UTC and can land on the wrong day in PH time).
        const toLocalDateStr = (d) => {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };

        const parseLocalDate = (str) => {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        const formatDayLabel = (str) =>
            parseLocalDate(str).toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

        // One labeled dropdown for the filter bar. Highlights itself when a non-default value is
        // picked so it's obvious at a glance which filters are narrowing the results.
        const FilterSelect = ({ label, icon, value, onChange, active, children }) => (
            <label className="block">
                <span className="block text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">{label}</span>
                <span className="relative block">
                    <i className={`fas ${icon} absolute left-3 top-1/2 -translate-y-1/2 text-[11px] pointer-events-none ${active ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400 dark:text-slate-500'}`}></i>
                    <select
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        className={`w-full appearance-none rounded-xl pl-8 pr-8 py-2 text-xs font-medium truncate focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 transition-colors border ${
                            active
                                ? 'bg-indigo-50 dark:bg-indigo-500/10 border-indigo-400 text-indigo-800 dark:text-indigo-200'
                                : 'bg-slate-50 dark:bg-slate-950 border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300'
                        }`}
                    >
                        {children}
                    </select>
                    <i className="fas fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 pointer-events-none"></i>
                </span>
            </label>
        );

        const FilterBar = ({ filters, setFilters, paymentMethods, branches, salesReps = [], onExportCSV, onResetFilters }) => {
            const todayStr = toLocalDateStr(new Date());
            const isSingleDay = !!filters.dateFrom && filters.dateFrom === filters.dateTo;
            // Can't step past today. If a single day is picked and it's today (or later), disable Next.
            const nextDisabled = isSingleDay && filters.dateFrom >= todayStr;

            // Moves From & To together to one single day. With no date picked yet, Prev starts at
            // yesterday and Next starts at today. With a range picked, it steps from the range's
            // start (Prev) or end (Next).
            const stepDay = (delta) => {
                let base;
                if (isSingleDay) {
                    base = parseLocalDate(filters.dateFrom);
                } else if (delta < 0) {
                    base = parseLocalDate(filters.dateFrom || todayStr);
                } else {
                    base = parseLocalDate(filters.dateTo || filters.dateFrom || todayStr);
                    if (!filters.dateFrom && !filters.dateTo) base.setDate(base.getDate() - 1); // so Next lands on today
                }
                base.setDate(base.getDate() + delta);
                let next = toLocalDateStr(base);
                if (next > todayStr) next = todayStr;
                setFilters({ ...filters, dateFrom: next, dateTo: next });
            };

            // How many filters are currently changing the results (drives the "N active" badge
            // and whether Reset looks clickable).
            const activeCount = [
                filters.search && filters.search.trim() !== '',
                filters.branch !== 'ALL',
                filters.salesRep && filters.salesRep !== 'ALL',
                filters.paymentMethod !== 'ALL',
                filters.returnFilter && filters.returnFilter !== 'ALL',
                filters.cwtFilter !== 'ALL',
                filters.vatFilter && filters.vatFilter !== 'ALL',
                !!(filters.dateFrom || filters.dateTo)
            ].filter(Boolean).length;

            const presets = [
                { label: 'Today', days: 0 },
                { label: '7 Days', days: 7 },
                { label: '30 Days', days: 30 },
                { label: 'This Month', days: 'month' },
            ];

            const applyPreset = (preset) => {
                const today = new Date();
                let from;
                if (preset.days === 'month') {
                    from = new Date(today.getFullYear(), today.getMonth(), 1);
                } else {
                    from = new Date(today);
                    from.setDate(from.getDate() - preset.days);
                }
                setFilters({ ...filters, dateFrom: toLocalDateStr(from), dateTo: toLocalDateStr(today) });
            };

            const isPresetActive = (preset) => {
                if (!filters.dateFrom || !filters.dateTo) return false;
                const today = new Date();
                let from;
                if (preset.days === 'month') from = new Date(today.getFullYear(), today.getMonth(), 1);
                else { from = new Date(today); from.setDate(from.getDate() - preset.days); }
                return filters.dateFrom === toLocalDateStr(from) && filters.dateTo === toLocalDateStr(today);
            };

            const dateInputCls = "w-full bg-slate-50 dark:bg-slate-950 border rounded-xl pl-3 pr-2 py-2 text-xs text-slate-700 dark:text-slate-300 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 transition-colors [color-scheme:light] dark:[color-scheme:dark]";

            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl mb-6 shadow-md">
                    {/* Row 1: search + reset + export */}
                    <div className="p-4 flex flex-col sm:flex-row sm:items-center gap-3">
                        <div className="relative flex-1 min-w-0">
                            <i className="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-xs"></i>
                            <input
                                type="text"
                                placeholder="Search customer, TIN, branch, sales rep, item, SKU, or Invoice #..."
                                value={filters.search}
                                onChange={(e) => setFilters({ ...filters, search: e.target.value })}
                                className={`w-full bg-slate-50 dark:bg-slate-950 border rounded-xl pl-9 pr-9 py-2.5 text-xs text-slate-800 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/15 transition-colors ${filters.search ? 'border-indigo-400' : 'border-slate-200 dark:border-slate-800'}`}
                            />
                            {filters.search && (
                                <button
                                    onClick={() => setFilters({ ...filters, search: '' })}
                                    title="Clear search"
                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200"
                                >
                                    <i className="fas fa-xmark text-xs"></i>
                                </button>
                            )}
                        </div>

                        <div className="flex items-center gap-2 shrink-0">
                            {activeCount > 0 && (
                                <span className="text-[11px] font-semibold text-indigo-700 dark:text-indigo-300 bg-indigo-500/10 border border-indigo-500/25 px-2.5 py-1 rounded-full whitespace-nowrap">
                                    {activeCount} active
                                </span>
                            )}
                            <button
                                onClick={onResetFilters}
                                disabled={activeCount === 0}
                                title="Reset all filters"
                                className="h-9 px-3 rounded-xl text-xs font-medium flex items-center gap-1.5 border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
                            >
                                <i className="fas fa-rotate-left text-[11px]"></i> Reset
                            </button>
                            <button
                                onClick={onExportCSV}
                                title="Download the filtered results as CSV"
                                className="h-9 px-4 rounded-xl text-xs font-semibold flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/25 transition-colors"
                            >
                                <i className="fas fa-file-csv text-sm"></i> Export
                            </button>
                        </div>
                    </div>

                    {/* Row 2: dropdown filters */}
                    <div className="px-4 pb-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3">
                        <FilterSelect label="Branch" icon="fa-store" active={filters.branch !== 'ALL'} value={filters.branch} onChange={(v) => setFilters({ ...filters, branch: v })}>
                            <option value="ALL">All branches</option>
                            {branches.map(b => <option key={b} value={b}>{b}</option>)}
                        </FilterSelect>

                        <FilterSelect label="Sales Rep" icon="fa-user-tie" active={!!filters.salesRep && filters.salesRep !== 'ALL'} value={filters.salesRep || 'ALL'} onChange={(v) => setFilters({ ...filters, salesRep: v })}>
                            <option value="ALL">All sales reps</option>
                            {salesReps.map(r => <option key={r} value={r}>{r}</option>)}
                            <option value="UNASSIGNED">(No sales rep)</option>
                        </FilterSelect>

                        <FilterSelect label="Payment" icon="fa-credit-card" active={filters.paymentMethod !== 'ALL'} value={filters.paymentMethod} onChange={(v) => setFilters({ ...filters, paymentMethod: v })}>
                            <option value="ALL">All payment methods</option>
                            {paymentMethods.map(pm => <option key={pm} value={pm}>{pm}</option>)}
                        </FilterSelect>

                        <FilterSelect label="Returns" icon="fa-rotate-left" active={!!filters.returnFilter && filters.returnFilter !== 'ALL'} value={filters.returnFilter || 'ALL'} onChange={(v) => setFilters({ ...filters, returnFilter: v })}>
                            <option value="ALL">All invoices</option>
                            <option value="WITH_RETURNS">With returned items</option>
                            <option value="NO_RETURNS">Without returns</option>
                        </FilterSelect>

                        <FilterSelect label="BIR 2307" icon="fa-file-signature" active={filters.cwtFilter !== 'ALL'} value={filters.cwtFilter} onChange={(v) => setFilters({ ...filters, cwtFilter: v })}>
                            <option value="ALL">All statuses</option>
                            <option value="WITH_2307">With 2307 (CWT &gt; 0%)</option>
                            <option value="NO_2307">No 2307 (0%)</option>
                        </FilterSelect>

                        <FilterSelect label="VAT" icon="fa-percent" active={!!filters.vatFilter && filters.vatFilter !== 'ALL'} value={filters.vatFilter || 'ALL'} onChange={(v) => setFilters({ ...filters, vatFilter: v })}>
                            <option value="ALL">All VAT types</option>
                            <option value="WITH_VAT">With VAT (VAT &gt; 0%)</option>
                            <option value="NO_VAT">Without VAT (0%)</option>
                        </FilterSelect>
                    </div>

                    {/* Row 3: dates */}
                    <div className="px-4 py-3.5 border-t border-slate-200/70 dark:border-slate-800/60 bg-slate-50/60 dark:bg-slate-950/30 rounded-b-2xl flex flex-wrap items-end gap-x-6 gap-y-3">
                        {/* Specific date (one day only) */}
                        <div>
                            <div className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Specific date</div>
                            <input
                                type="date"
                                aria-label="Specific date"
                                value={isSingleDay ? filters.dateFrom : ''}
                                onChange={(e) => setFilters({ ...filters, dateFrom: e.target.value, dateTo: e.target.value })}
                                className={`${dateInputCls} w-[9.25rem] ${isSingleDay ? 'border-indigo-400' : 'border-slate-200 dark:border-slate-800'}`}
                            />
                        </div>

                        {/* Date range */}
                        <div>
                            <div className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Date range</div>
                            <div className="flex items-center gap-2">
                                <input
                                    type="date"
                                    aria-label="From date"
                                    value={filters.dateFrom || ''}
                                    onChange={(e) => setFilters({ ...filters, dateFrom: e.target.value })}
                                    max={filters.dateTo || undefined}
                                    className={`${dateInputCls} w-[9.25rem] ${filters.dateFrom ? 'border-indigo-400' : 'border-slate-200 dark:border-slate-800'}`}
                                />
                                <i className="fas fa-arrow-right-long text-slate-400 text-xs"></i>
                                <input
                                    type="date"
                                    aria-label="To date"
                                    value={filters.dateTo || ''}
                                    onChange={(e) => setFilters({ ...filters, dateTo: e.target.value })}
                                    min={filters.dateFrom || undefined}
                                    className={`${dateInputCls} w-[9.25rem] ${filters.dateTo ? 'border-indigo-400' : 'border-slate-200 dark:border-slate-800'}`}
                                />
                            </div>
                        </div>

                        {/* Quick range */}
                        <div>
                            <div className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Quick range</div>
                            <div className="inline-flex items-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-0.5">
                                {presets.map(preset => (
                                    <button
                                        key={preset.label}
                                        onClick={() => applyPreset(preset)}
                                        className={`h-8 px-3 rounded-[10px] text-[11px] font-semibold transition-colors ${
                                            isPresetActive(preset)
                                                ? 'bg-indigo-600 text-white shadow-sm'
                                                : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                                        }`}
                                    >
                                        {preset.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Day by day */}
                        <div>
                            <div className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Day by day</div>
                            <div className="inline-flex items-center rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-0.5">
                                <button
                                    onClick={() => stepDay(-1)}
                                    title="Previous day"
                                    className="h-8 w-8 rounded-[10px] text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                                >
                                    <i className="fas fa-chevron-left text-[10px]"></i>
                                </button>
                                <span className={`px-3 min-w-[9.5rem] text-center text-[11px] font-semibold whitespace-nowrap ${isSingleDay ? 'text-indigo-700 dark:text-indigo-300' : 'text-slate-400 dark:text-slate-500 font-medium'}`}>
                                    {isSingleDay ? formatDayLabel(filters.dateFrom) : 'Step through days'}
                                </span>
                                <button
                                    onClick={() => stepDay(1)}
                                    disabled={nextDisabled}
                                    title={nextDisabled ? 'Already at today' : 'Next day'}
                                    className="h-8 w-8 rounded-[10px] text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:bg-transparent transition-colors"
                                >
                                    <i className="fas fa-chevron-right text-[10px]"></i>
                                </button>
                            </div>
                        </div>

                        {(filters.dateFrom || filters.dateTo) && (
                            <button
                                onClick={() => setFilters({ ...filters, dateFrom: '', dateTo: '' })}
                                className="h-9 px-3 rounded-xl text-[11px] font-semibold flex items-center gap-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-700 dark:text-rose-300 border border-rose-500/30 transition-colors"
                            >
                                <i className="fas fa-xmark"></i> Clear dates
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const ProcessReturnModal = ({ isOpen, invoice, onClose, onSaveReturn }) => {
            if (!isOpen || !invoice) return null;

            const availableItems = invoice.items.filter(item => (item.qty - (item.returnedQty || 0)) > 0);

            const lineIdRef = React.useRef(1);
            const makeLineId = () => `L${lineIdRef.current++}`;

            // Multiple returned line items (e.g. a monitor AND a keyboard returned
            // together) all share one Credit Note No., date, refund method, and
            // remarks — those are document-level fields — but each line item keeps
            // its own product, quantity, and reason.
            const [lines, setLines] = React.useState(() => [
                availableItems[0]
                    ? { key: makeLineId(), itemId: String(availableItems[0].id), qty: 1, reason: 'Defective / Damaged' }
                    : { key: makeLineId(), itemId: '', qty: 0, reason: 'Defective / Damaged' }
            ]);
            const [refundMethod, setRefundMethod] = React.useState('Store Credit / Credit Memo');
            const [remarks, setRemarks] = React.useState('');
            const [creditNoteNo, setCreditNoteNo] = React.useState(`CN-2026-${Math.floor(100 + Math.random() * 900)}`);
            const [returnDate, setReturnDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [errorMsg, setErrorMsg] = React.useState('');

            const usedItemIds = new Set(lines.map(l => String(l.itemId)));
            const unusedItems = availableItems.filter(item => !usedItemIds.has(String(item.id)));
            const canAddLine = unusedItems.length > 0;

            // A line's own item, plus every other item still not claimed by another
            // line (so its dropdown always includes its current pick + whatever's left).
            const getOptionsForLine = (lineKey) => {
                const line = lines.find(l => l.key === lineKey);
                return availableItems.filter(item =>
                    String(item.id) === String(line?.itemId) || !usedItemIds.has(String(item.id))
                );
            };

            const getItemById = (itemId) => invoice.items.find(i => String(i.id) === String(itemId));
            const getMaxQty = (itemId) => {
                const item = getItemById(itemId);
                return item ? (item.qty - (item.returnedQty || 0)) : 0;
            };

            const handleAddLine = () => {
                if (!canAddLine) return;
                const nextItem = unusedItems[0];
                setLines([...lines, { key: makeLineId(), itemId: String(nextItem.id), qty: 1, reason: 'Defective / Damaged' }]);
            };

            const handleRemoveLine = (key) => {
                if (lines.length === 1) return;
                setLines(lines.filter(l => l.key !== key));
            };

            const handleLineChange = (key, field, value) => {
                setLines(lines.map(l => {
                    if (l.key !== key) return l;
                    if (field === 'itemId') {
                        const max = getMaxQty(value);
                        return { ...l, itemId: value, qty: max > 0 ? 1 : 0 };
                    }
                    return { ...l, [field]: value };
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!creditNoteNo.trim()) {
                    setErrorMsg('Please enter a Credit Note No.');
                    return;
                }

                if (!returnDate) {
                    setErrorMsg('Please select a return date.');
                    return;
                }

                const seen = new Set();
                for (const line of lines) {
                    const item = getItemById(line.itemId);
                    if (!item) {
                        setErrorMsg('Please select a valid item for every return line.');
                        return;
                    }
                    if (seen.has(String(item.id))) {
                        setErrorMsg(`${item.name} is selected more than once — combine it into a single line instead.`);
                        return;
                    }
                    seen.add(String(item.id));
                    const max = item.qty - (item.returnedQty || 0);
                    const qty = parseInt(line.qty);
                    if (!qty || qty <= 0 || qty > max) {
                        setErrorMsg(`Quantity for ${item.name} must be between 1 and ${max}.`);
                        return;
                    }
                }

                const baseId = invoice.id.replace(/^INV-/, '');
                const existingReturnsCount = invoice.returns?.length || 0;

                const returnPayload = lines.map((line, idx) => {
                    const item = getItemById(line.itemId);
                    const qty = parseInt(line.qty);
                    const lineUnitPrice = item.unitPrice; // VAT-inclusive
                    const lineDiscount = item.discountPercent || 0;
                    const grossReturnInclusive = (qty * lineUnitPrice) * (1 - (lineDiscount / 100)); // VAT-inclusive credit value
                    const totalCreditMemoVal = grossReturnInclusive; // Already VAT-inclusive — don't add tax again

                    const record = {
                        id: `RET-${baseId}-${existingReturnsCount + idx + 1}`,
                        date: returnDate,
                        itemId: item.id,
                        itemName: item.name,
                        qty,
                        unitPrice: lineUnitPrice,
                        discountPercent: lineDiscount,
                        reason: line.reason,
                        refundMethod,
                        creditNoteNo: creditNoteNo.trim(),
                        remarks,
                        creditAmount: totalCreditMemoVal
                    };

                    return { itemId: item.id, qty, record };
                });

                onSaveReturn(invoice.id, returnPayload);
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 flex items-start justify-center bg-slate-900/50 dark:bg-slate-950/80 backdrop-blur-md p-4 overflow-y-auto">
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden my-8">
                        <div className="bg-rose-50 dark:bg-rose-950/60 border-b border-rose-500/30 px-6 py-4 flex justify-between items-center">
                            <h3 className="text-base font-bold text-rose-700 dark:text-rose-300 flex items-center gap-2">
                                <i className="fas fa-rotate-left"></i> Process Item Return / Credit Memo
                            </h3>
                            <button onClick={onClose} className="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6 space-y-4 text-xs">
                            <div className="bg-slate-50 dark:bg-slate-950 p-3 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 flex justify-between">
                                <div>
                                    <span className="text-slate-600 dark:text-slate-500 block">Invoice Reference:</span>
                                    <strong className="text-slate-900 dark:text-white font-mono">{invoice.id}</strong> ({invoice.branch})
                                </div>
                                <div className="text-right">
                                    <span className="text-slate-600 dark:text-slate-500 block">Customer:</span>
                                    <strong className="text-indigo-600 dark:text-indigo-400">{invoice.customer.name}</strong>
                                </div>
                            </div>

                            {errorMsg && (
                                <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 font-medium text-xs">
                                    <i className="fas fa-exclamation-circle mr-1"></i> {errorMsg}
                                </div>
                            )}

                            <div className="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-700 dark:text-indigo-300 text-[11px]">
                                <i className="fas fa-circle-info mr-1"></i> This issues a Credit Note but does <strong>not</strong> reduce this invoice's total. The credit note is applied later, when this customer buys again — pick it under "Apply Available Credit Note" on their next invoice. Returning 2+ products together? Add them all below — they'll share one Credit Note No. and redeem as a single credit note.
                            </div>

                            {availableItems.length === 0 ? (
                                <div className="text-center py-6 text-slate-500 dark:text-slate-400">
                                    <i className="fas fa-check-double text-emerald-600 dark:text-emerald-400 text-2xl mb-2 block"></i>
                                    All items on this invoice have already been returned.
                                </div>
                            ) : (
                                <>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Credit Note No. *</label>
                                            <input
                                                type="text"
                                                required
                                                placeholder="CN-2026-XXX"
                                                value={creditNoteNo}
                                                onChange={(e) => setCreditNoteNo(e.target.value)}
                                                className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-900 dark:text-white font-mono font-medium focus:border-rose-500"
                                            />
                                            <span className="text-[10px] text-slate-600 dark:text-slate-500 mt-0.5 block">Pre-filled with a suggested number — edit to match your own CN series. Same number for every item below.</span>
                                        </div>

                                        <div>
                                            <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Credit Note Date *</label>
                                            <input
                                                type="date"
                                                required
                                                value={returnDate}
                                                onChange={(e) => setReturnDate(e.target.value)}
                                                className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-900 dark:text-white font-medium focus:border-rose-500"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex items-center justify-between mb-1">
                                            <label className="block text-slate-700 dark:text-slate-300 font-medium">Items Being Returned *</label>
                                            <button
                                                type="button"
                                                onClick={handleAddLine}
                                                disabled={!canAddLine}
                                                className="text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 disabled:opacity-30 disabled:cursor-not-allowed font-medium flex items-center gap-1"
                                            >
                                                <i className="fas fa-plus"></i> Add Another Item
                                            </button>
                                        </div>

                                        <div className="space-y-3">
                                            {lines.map((line, idx) => {
                                                const options = getOptionsForLine(line.key);
                                                const maxQty = getMaxQty(line.itemId);
                                                return (
                                                    <div key={line.key} className="p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 space-y-2">
                                                        <div className="flex items-center gap-2">
                                                            <select
                                                                value={line.itemId}
                                                                onChange={(e) => handleLineChange(line.key, 'itemId', e.target.value)}
                                                                className="flex-1 min-w-0 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-900 dark:text-white focus:border-rose-500"
                                                            >
                                                                {options.map(item => {
                                                                    const itemMaxQty = item.qty - (item.returnedQty || 0);
                                                                    return (
                                                                        <option key={item.id} value={item.id}>
                                                                            {item.name} ({item.sku}) &mdash; {itemMaxQty} unit(s) available for return
                                                                        </option>
                                                                    );
                                                                })}
                                                            </select>
                                                            <button
                                                                type="button"
                                                                onClick={() => handleRemoveLine(line.key)}
                                                                disabled={lines.length === 1}
                                                                className="text-slate-500 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 disabled:opacity-30 px-2 py-2"
                                                            >
                                                                <i className="fas fa-trash-can"></i>
                                                            </button>
                                                        </div>

                                                        <div className="grid grid-cols-2 gap-3">
                                                            <div>
                                                                <label className="block text-slate-600 dark:text-slate-400 font-medium mb-1">Quantity to Return *</label>
                                                                <input
                                                                    type="number"
                                                                    min="1"
                                                                    max={maxQty}
                                                                    value={line.qty}
                                                                    onChange={(e) => handleLineChange(line.key, 'qty', e.target.value)}
                                                                    className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-900 dark:text-white text-center font-bold focus:border-rose-500"
                                                                />
                                                                <span className="text-[10px] text-slate-600 dark:text-slate-500 mt-0.5 block">Max allowed: {maxQty} unit(s)</span>
                                                            </div>

                                                            <div>
                                                                <label className="block text-slate-600 dark:text-slate-400 font-medium mb-1">Reason for Return *</label>
                                                                <select
                                                                    value={line.reason}
                                                                    onChange={(e) => handleLineChange(line.key, 'reason', e.target.value)}
                                                                    className="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-900 dark:text-white focus:border-rose-500"
                                                                >
                                                                    <option value="Defective / Damaged">Defective / Damaged Unit</option>
                                                                    <option value="Wrong Item / Model">Wrong Item / Model Shipped</option>
                                                                    <option value="Customer Change of Mind">Customer Change of Mind</option>
                                                                    <option value="Order Cancellation">Order Cancellation</option>
                                                                    <option value="Warranty Return">Warranty Return / Replacement</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Refund / Adjustment Mechanism *</label>
                                        <select
                                            value={refundMethod}
                                            onChange={(e) => setRefundMethod(e.target.value)}
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-900 dark:text-white focus:border-rose-500"
                                        >
                                            <option value="Store Credit / Credit Memo">Store Credit / Credit Memo</option>
                                            <option value="Cash Refund">Cash Refund</option>
                                            <option value="GCash / Maya Refund">GCash / Maya Online Refund</option>
                                            <option value="Bank Refund (BDO/BPI)">Bank Transfer Refund</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-slate-700 dark:text-slate-300 font-medium mb-1">Return Remarks / Inspection Notes</label>
                                        <textarea
                                            rows="2"
                                            placeholder="Write item serial number, damage note, or replacement store credit details..."
                                            value={remarks}
                                            onChange={(e) => setRemarks(e.target.value)}
                                            className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-slate-900 dark:text-white focus:border-rose-500"
                                        ></textarea>
                                    </div>

                                    <div className="pt-2 flex justify-end gap-3 border-t border-slate-200 dark:border-slate-800">
                                        <button
                                            type="button"
                                            onClick={onClose}
                                            className="bg-slate-100 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-4 py-2 rounded-xl transition-colors"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="bg-rose-600 hover:bg-rose-500 text-white font-semibold px-5 py-2 rounded-xl shadow-lg shadow-rose-600/30 transition-colors"
                                        >
                                            Confirm Item Return{lines.length > 1 ? 's' : ''} & Issue Credit Memo
                                        </button>
                                    </div>
                                </>
                            )}
                        </form>
                    </div>
                </div>
            );
        };

        // Shows the invoice's sales rep with a pencil to edit it in place (also used to fill in
        // invoices that were logged before this field existed). Own component so its state
        // doesn't depend on InvoiceModal's hook order.
        const SalesRepEditor = ({ invoiceId, value, salesReps = [], onSave }) => {
            const [editing, setEditing] = React.useState(false);
            const [draft, setDraft] = React.useState(value || '');
            const [saving, setSaving] = React.useState(false);

            React.useEffect(() => { if (!editing) setDraft(value || ''); }, [value, editing]);

            const commit = async () => {
                const next = draft.trim();
                if (next === (value || '')) { setEditing(false); return; }
                setSaving(true);
                try { await onSave(invoiceId, next); setEditing(false); }
                finally { setSaving(false); }
            };

            if (!editing) {
                return (
                    <div className="mt-2 flex items-center gap-2">
                        <i className="fas fa-user-tie text-indigo-600 dark:text-indigo-400 text-sm"></i>
                        <span className="text-slate-500 dark:text-slate-400">Sales Rep:</span>
                        <span className="font-semibold text-slate-900 dark:text-white">{value || <span className="text-slate-400 dark:text-slate-600 font-normal">Not assigned</span>}</span>
                        {onSave && (
                            <button onClick={() => setEditing(true)} title="Edit sales representative" className="no-print text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
                                <i className="fas fa-pen text-[10px]"></i>
                            </button>
                        )}
                    </div>
                );
            }

            return (
                <div className="no-print mt-2 flex items-center gap-1.5">
                    <i className="fas fa-user-tie text-indigo-600 dark:text-indigo-400 text-sm"></i>
                    <input
                        type="text"
                        autoFocus
                        list="sales-rep-options-modal"
                        placeholder="Sales representative"
                        value={draft}
                        onChange={(e) => setDraft(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') setEditing(false); }}
                        className="flex-1 min-w-0 px-2 py-1 rounded-lg bg-white dark:bg-slate-900 border border-indigo-400 text-xs text-slate-900 dark:text-white focus:outline-none"
                    />
                    <datalist id="sales-rep-options-modal">
                        {salesReps.map(r => <option key={r} value={r} />)}
                    </datalist>
                    <button onClick={commit} disabled={saving} className="text-emerald-600 dark:text-emerald-400 hover:opacity-75">
                        <i className={`fas ${saving ? 'fa-circle-notch fa-spin' : 'fa-check'}`}></i>
                    </button>
                    <button onClick={() => setEditing(false)} className="text-slate-400 hover:text-rose-500">
                        <i className="fas fa-xmark"></i>
                    </button>
                </div>
            );
        };

        const CWT_RATE_OPTIONS = [
            { rate: 1, atc: 'WC158', label: '1% - Purchase of Goods (WC158)' },
            { rate: 2, atc: 'WC160', label: '2% - Services / Contractors (WC160)' },
            { rate: 5, atc: 'WC100', label: '5% - Rental Payments (WC100)' },
            { rate: 10, atc: 'WI010', label: '10% - Professional Fees (WI010)' },
        ];

        // Shows whether BIR 2307 applies to this invoice. Admins get a pencil to change it
        // (applicable or not, rate, ATC code); everyone else just sees the status.
        const Cwt2307Editor = ({ invoice, cwtAmount, isAdmin, onSave }) => {
            const currentRate = Number(invoice.cwt2307Rate) || 0;
            const [editing, setEditing] = React.useState(false);
            const [applicable, setApplicable] = React.useState(currentRate > 0);
            const [rate, setRate] = React.useState(currentRate > 0 ? String(currentRate) : '1');
            const [atc, setAtc] = React.useState(invoice.atcCode && invoice.atcCode !== 'N/A' ? invoice.atcCode : 'WC158');
            const [saving, setSaving] = React.useState(false);
            const [error, setError] = React.useState('');

            const openEditor = () => {
                setApplicable(currentRate > 0);
                setRate(currentRate > 0 ? String(currentRate) : '1');
                setAtc(invoice.atcCode && invoice.atcCode !== 'N/A' ? invoice.atcCode : (CWT_RATE_OPTIONS.find(o => o.rate === currentRate) || CWT_RATE_OPTIONS[0]).atc);
                setError('');
                setEditing(true);
            };

            const commit = async () => {
                const nextRate = applicable ? parseFloat(rate) : 0;
                if (applicable && !(nextRate > 0)) { setError('Pick a withholding rate.'); return; }
                if (nextRate === currentRate && (!applicable || atc.trim() === (invoice.atcCode || ''))) { setEditing(false); return; }
                setSaving(true);
                setError('');
                try {
                    await onSave(invoice.id, nextRate, atc.trim());
                    setEditing(false);
                } catch (err) {
                    setError(err.message || 'Could not save.');
                } finally {
                    setSaving(false);
                }
            };

            if (!editing) {
                return (
                    <div className="mt-2 flex items-center gap-2 flex-wrap">
                        <i className="fas fa-file-signature text-amber-600 dark:text-amber-400 text-sm"></i>
                        <span className="text-slate-500 dark:text-slate-400">BIR 2307:</span>
                        {currentRate > 0 ? (
                            <span className="font-semibold text-amber-700 dark:text-amber-300">
                                Applicable · {currentRate}%{invoice.atcCode && invoice.atcCode !== 'N/A' ? ` · ${invoice.atcCode}` : ''} · {formatCurrency(cwtAmount)}
                            </span>
                        ) : (
                            <span className="font-semibold text-slate-500 dark:text-slate-400">Not applicable</span>
                        )}
                        {isAdmin && onSave && (
                            <button onClick={openEditor} title="Edit BIR 2307 (admin)" className="no-print text-slate-400 hover:text-amber-600 dark:hover:text-amber-400">
                                <i className="fas fa-pen text-[10px]"></i>
                            </button>
                        )}
                    </div>
                );
            }

            return (
                <div className="no-print mt-3 p-3 rounded-xl border border-amber-500/40 bg-amber-500/5 space-y-2.5">
                    <div className="flex items-center justify-between">
                        <span className="text-[10px] font-semibold uppercase tracking-wider text-amber-700 dark:text-amber-300">
                            <i className="fas fa-file-signature mr-1"></i> Edit BIR 2307
                        </span>
                        <span className="text-[10px] text-slate-400">Admin only</span>
                    </div>

                    <label className="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" checked={applicable} onChange={(e) => setApplicable(e.target.checked)} className="w-4 h-4 accent-amber-600" />
                        <span className="font-medium text-slate-800 dark:text-slate-200">BIR 2307 applies to this invoice</span>
                    </label>

                    {applicable && (
                        <div className="grid grid-cols-1 gap-2">
                            <select
                                value={CWT_RATE_OPTIONS.some(o => String(o.rate) === String(rate)) ? rate : ''}
                                onChange={(e) => {
                                    setRate(e.target.value);
                                    const opt = CWT_RATE_OPTIONS.find(o => String(o.rate) === e.target.value);
                                    if (opt) setAtc(opt.atc);
                                }}
                                className="w-full bg-white dark:bg-slate-950 border border-amber-500/50 rounded-lg px-2.5 py-1.5 text-xs text-amber-800 dark:text-amber-200 font-semibold focus:outline-none"
                            >
                                {!CWT_RATE_OPTIONS.some(o => String(o.rate) === String(rate)) && <option value="">{rate}% (current)</option>}
                                {CWT_RATE_OPTIONS.map(o => <option key={o.rate} value={o.rate}>{o.label}</option>)}
                            </select>
                            <input
                                type="text"
                                value={atc}
                                onChange={(e) => setAtc(e.target.value)}
                                placeholder="ATC code"
                                className="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-amber-500"
                            />
                        </div>
                    )}

                    {error && <p className="text-[11px] text-rose-600 dark:text-rose-400">{error}</p>}

                    <div className="flex items-center gap-2">
                        <button onClick={commit} disabled={saving} className="px-3 py-1.5 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold disabled:opacity-60 flex items-center gap-1.5">
                            <i className={`fas ${saving ? 'fa-circle-notch fa-spin' : 'fa-check'}`}></i> Save
                        </button>
                        <button onClick={() => setEditing(false)} disabled={saving} className="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-800">
                            Cancel
                        </button>
                    </div>
                </div>
            );
        };

        const InvoiceModal = ({ invoice, onClose, onOpenReturnModal, creditNotes = [], onApplyCreditNote, salesReps = [], onUpdateSalesRep, isAdmin = false, onUpdateCwt2307, onEditInvoice }) => {
            if (!invoice) return null;
            const totals = calculateInvoiceTotals(invoice);
            const [selectedApplyCnId, setSelectedApplyCnId] = React.useState('');
            const [applyAmount, setApplyAmount] = React.useState(0);
            const [isApplying, setIsApplying] = React.useState(false);

            // Credit notes this customer could redeem against THIS invoice: same
            // customer (by email, or by name when no email is on file), still has an
            // open balance, and didn't originate from this very invoice (redeeming a
            // credit note against the invoice that generated it doesn't make sense).
            const eligibleCreditNotesForThisInvoice = React.useMemo(() => {
                const key = getCreditMatchKey(invoice.customer || {});
                if (!key) return [];
                return creditNotes.filter(cn =>
                    cn.customerKey === key &&
                    cn.remainingBalance > 0.005 &&
                    cn.originInvoiceId !== invoice.id
                );
            }, [creditNotes, invoice]);

            const selectedApplyCn = eligibleCreditNotesForThisInvoice.find(cn => String(cn.id) === String(selectedApplyCnId)) || null;

            React.useEffect(() => {
                if (!selectedApplyCn) {
                    setApplyAmount(0);
                    return;
                }
                setApplyAmount(Math.min(selectedApplyCn.remainingBalance, totals.netPayable) || 0);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [selectedApplyCnId]);

            const handleApplyClick = async () => {
                if (!selectedApplyCn || !onApplyCreditNote) return;
                const cappedAmount = Math.min(
                    parseFloat(applyAmount) || 0,
                    selectedApplyCn.remainingBalance,
                    totals.netPayable
                );
                if (cappedAmount <= 0) return;
                setIsApplying(true);
                try {
                    await onApplyCreditNote(invoice.id, selectedApplyCn.id, cappedAmount, new Date().toISOString().slice(0, 10));
                    setSelectedApplyCnId('');
                    setApplyAmount(0);
                } finally {
                    setIsApplying(false);
                }
            };

            const handlePrint = () => {
                logAppEvent('PRINT_INVOICE', invoice.id, 'Printed invoice');
                window.print();
            };

            return (
                <div className="invoice-modal-root fixed inset-0 z-50 flex items-start justify-center bg-slate-900/50 dark:bg-slate-950/80 backdrop-blur-md p-4 overflow-y-auto">
                    <div className="invoice-modal-paper bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden my-8 transform transition-all">
                        {/* Header Controls */}

        const NewTransactionModal = ({ isOpen, onClose, onSave, branches, products = [], customers = [], creditNotes = [], salesReps = [] }) => {

            const [invoiceDate, setInvoiceDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [customerName, setCustomerName] = React.useState('');
            const [customerEmail, setCustomerEmail] = React.useState('');
            const [customerPhone, setCustomerPhone] = React.useState('');
            const [company, setCompany] = React.useState('');
            const [tin, setTin] = React.useState('');
            const [branch, setBranch] = React.useState(branches[0] || 'Banawe Branch');
            const [customBranch, setCustomBranch] = React.useState('');
            const [isCustomBranch, setIsCustomBranch] = React.useState(false);
            const [paymentMethod, setPaymentMethod] = React.useState('Cash');
            const [taxRate, setTaxRate] = React.useState(12.0); // PH standard 12% VAT
            const [cwt2307Rate, setCwt2307Rate] = React.useState(0.0); // 0%, 1%, 2% BIR 2307
            const [atcCode, setAtcCode] = React.useState('WC160');
            const [notes, setNotes] = React.useState('');
            const [salesRep, setSalesRep] = React.useState('');
            const [errorMsg, setErrorMsg] = React.useState('');
            const [items, setItems] = React.useState([
                { name: '', sku: '', category: 'General', unitPrice: 0, qty: 1, discountPercent: 0 }
            ]);
            const [selectedCreditNoteId, setSelectedCreditNoteId] = React.useState('');
            const [creditAmountToApply, setCreditAmountToApply] = React.useState(0);

            // This is where a credit note actually gets redeemed: only when the customer
            // buys again and a new invoice is being logged, never against the invoice it
            // was originally issued from.
            const eligibleCreditNotes = React.useMemo(() => {
                const key = getCreditMatchKey({ name: customerName, email: customerEmail });
                if (!key) return [];
                return creditNotes.filter(cn => cn.customerKey === key && cn.remainingBalance > 0.005);
            }, [creditNotes, customerName, customerEmail]);

            const selectedCreditNote = eligibleCreditNotes.find(cn => String(cn.id) === String(selectedCreditNoteId)) || null;

            // Rough VAT-inclusive invoice total from the items entered so far, just to cap
            // how much credit can be applied (can't apply more than what's being billed).
            const estimatedInvoiceTotal = items.reduce((sum, it) => {
                const qty = parseInt(it.qty) || 0;
                const price = parseFloat(it.unitPrice) || 0;
                const disc = parseFloat(it.discountPercent) || 0;
                return sum + (qty * price * (1 - disc / 100));
            }, 0);

            React.useEffect(() => {
                if (!selectedCreditNote) {
                    setCreditAmountToApply(0);
                    return;
                }
                setCreditAmountToApply(Math.min(selectedCreditNote.remainingBalance, estimatedInvoiceTotal) || 0);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [selectedCreditNoteId]);

            const handleAddItem = () => {
                setItems([...items, { name: '', sku: '', category: 'General', unitPrice: 0, qty: 1, discountPercent: 0 }]);
            };

            const handleRemoveItem = (index) => {
                if (items.length === 1) return;
                setItems(items.filter((_, i) => i !== index));
            };

            // When the customer name matches someone from a past invoice
            // (picked from the datalist, or just typed the same way), auto-fill
            // their company/TIN/phone/email so the person doesn't retype it.
            const handleCustomerNameChange = (value) => {
                setCustomerName(value);
                const match = customers.find(c => c.name.toLowerCase() === value.toLowerCase());
                if (match) {
                    setCompany(match.company || '');
                    setTin(match.tin || '');
                    setCustomerPhone(match.phone || '');
                    setCustomerEmail(match.email || '');
                }
            };

            const handleItemChange = (index, field, value) => {
                const newItems = [...items];
                newItems[index][field] = value;

                // When the product name matches an entry in the catalog (picked
                // from the datalist), auto-fill SKU/category/price so the person
                // only has to set qty and discount.
                if (field === 'name') {
                    const match = products.find(p => p.name.toLowerCase() === String(value).toLowerCase());
                    if (match) {
                        newItems[index].sku = match.sku || '';
                        newItems[index].category = match.category || 'General';
