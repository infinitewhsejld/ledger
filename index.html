        const ProductAnalyticsView = ({ invoices, products = [], isAdmin = false, onSrpSaved = () => {} }) => {
            const [editingKey, setEditingKey] = React.useState(null);
            const [editValue, setEditValue] = React.useState('');
            const [savingKey, setSavingKey] = React.useState(null);

            const productBySku = React.useMemo(() => {
                const map = new Map();
                products.forEach(p => { if (p.sku) map.set(p.sku, p); });
                return map;
            }, [products]);

            const productStats = React.useMemo(() => {
                const map = {};
                invoices.forEach(inv => {
                    inv.items.forEach(item => {
                        const key = item.sku || item.name;
                        if (!map[key]) {
                            const catalogEntry = item.sku ? productBySku.get(item.sku) : null;
                            map[key] = {
                                id: catalogEntry?.id || item.productId || null,
                                name: item.name,
                                sku: item.sku,
                                category: item.category,
                                unitPrice: item.unitPrice,
                                srp: catalogEntry ? catalogEntry.srp : null,
                                totalPurchasedQty: 0,
                                totalReturnedQty: 0,
                                totalRevenue: 0,
                                totalDiscountGiven: 0
                            };
                        }
                        const retQty = item.returnedQty || 0;
                        const activeQty = item.qty - retQty;
                        map[key].totalPurchasedQty += item.qty;
                        map[key].totalReturnedQty += retQty;
                        map[key].totalDiscountGiven += calculateItemDiscountAmount(item, true);
                        map[key].totalRevenue += calculateItemNet(item, true);
                    });
                });
                return Object.values(map);
            }, [invoices, productBySku]);

            // Sorting: click any column header to sort by it (click again to flip direction).
            // The "Top ..." buttons are just shortcuts that set a sort (and, for returns, hide
            // products that were never returned).
            const [sortKey, setSortKey] = React.useState(null);
            const [sortDir, setSortDir] = React.useState('desc');
            const [onlyReturned, setOnlyReturned] = React.useState(false);

            const returnRateOf = (p) => p.totalPurchasedQty > 0 ? p.totalReturnedQty / p.totalPurchasedQty : 0;
            const sortValue = (p, key) => {
                if (key === 'returnRate') return returnRateOf(p);
                const v = p[key];
                return v === undefined ? null : v;
            };

            const visibleProducts = React.useMemo(() => {
                let list = onlyReturned ? productStats.filter(p => p.totalReturnedQty > 0) : productStats;
                if (!sortKey) return list;
                const dir = sortDir === 'asc' ? 1 : -1;
                return [...list].sort((a, b) => {
                    const av = sortValue(a, sortKey);
                    const bv = sortValue(b, sortKey);
                    // Empty values (e.g. a product with no SRP yet) always sink to the bottom.
                    if (av === null && bv === null) return 0;
                    if (av === null) return 1;
                    if (bv === null) return -1;
                    if (typeof av === 'string' || typeof bv === 'string') {
                        return String(av).localeCompare(String(bv), undefined, { sensitivity: 'base' }) * dir;
                    }
                    const diff = (av - bv) * dir;
                    if (diff !== 0) return diff;
                    // Tie-break by name so the order is stable.
                    return String(a.name).localeCompare(String(b.name));
                });
            }, [productStats, sortKey, sortDir, onlyReturned]);

            const pg = usePagination(visibleProducts, 10, `${sortKey}|${sortDir}|${onlyReturned}`);

            const handleHeaderSort = (key) => {
                setOnlyReturned(false);
                if (sortKey === key) {
                    setSortDir(d => (d === 'asc' ? 'desc' : 'asc'));
                } else {
                    setSortKey(key);
                    // Names/SKUs read best A→Z; every number column starts biggest-first.
                    setSortDir(key === 'name' || key === 'sku' ? 'asc' : 'desc');
                }
            };

            const PRODUCT_REPORTS = [
                { key: 'all', label: 'All Products', icon: 'fa-boxes-stacked', sort: null, dir: 'desc', returnedOnly: false },
                { key: 'topRevenue', label: 'Top Net Sales Revenue', icon: 'fa-sack-dollar', sort: 'totalRevenue', dir: 'desc', returnedOnly: false },
                { key: 'topUnits', label: 'Top Units Sold', icon: 'fa-cubes', sort: 'totalPurchasedQty', dir: 'desc', returnedOnly: false },
                { key: 'topReturns', label: 'Top Returned Items', icon: 'fa-rotate-left', sort: 'totalReturnedQty', dir: 'desc', returnedOnly: true },
            ];

            const activeReport = (PRODUCT_REPORTS.find(r =>
                r.sort === sortKey && r.returnedOnly === onlyReturned && (r.sort === null || r.dir === sortDir)
            ) || {}).key || null;

            const applyReport = (r) => {
                setSortKey(r.sort);
                setSortDir(r.dir);
                setOnlyReturned(r.returnedOnly);
            };

            const COLUMNS = [
                { key: 'name', label: 'Product Name & Category', align: 'left', cls: 'px-4' },
                { key: 'sku', label: 'SKU', align: 'left', cls: 'px-3 font-mono' },
                { key: 'unitPrice', label: 'Unit Price', align: 'right', cls: 'px-3' },
                { key: 'srp', label: 'SRP', align: 'right', cls: 'px-3' },
                { key: 'totalPurchasedQty', label: 'Units Sold', align: 'center', cls: 'px-3' },
                { key: 'totalReturnedQty', label: 'Units Returned', align: 'center', cls: 'px-3' },
                { key: 'returnRate', label: 'Return Rate %', align: 'center', cls: 'px-3' },
                { key: 'totalRevenue', label: 'Net Sales Revenue', align: 'right', cls: 'px-3' },
            ];

            const startEditing = (prod) => {
                setEditingKey(prod.sku || prod.name);
                setEditValue(prod.srp !== null && prod.srp !== undefined ? String(prod.srp) : '');
            };

            const cancelEditing = () => {
                setEditingKey(null);
                setEditValue('');
            };

            const saveSrp = async (prod) => {
                if (!prod.id) { cancelEditing(); return; }
                const parsed = editValue.trim() === '' ? null : Number(editValue);
                if (parsed !== null && Number.isNaN(parsed)) return;
                const key = prod.sku || prod.name;
                setSavingKey(key);
                try {
                    const { error } = await sb.from('products').update({ srp: parsed }).eq('id', prod.id);
                    if (error) throw new Error(error.message);
                    onSrpSaved();
                } catch (err) {
                    console.error(err);
                } finally {
                    setSavingKey(null);
                    cancelEditing();
                }
            };

            return (
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xl">
                    <h2 className="text-base font-bold font-display text-slate-900 dark:text-white flex items-center gap-2 mb-2">
                        <i className="fas fa-boxes-stacked text-indigo-600 dark:text-indigo-400"></i> Product Sales & Return Analytics
                    </h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mb-5">Breakdown of product performance, discounts granted, returned unit volumes, and net item revenues. Click any column header to sort.</p>

                    <div className="flex flex-wrap items-center gap-2 mb-5">
                        {PRODUCT_REPORTS.map(r => (
                            <button
                                key={r.key}
                                onClick={() => applyReport(r)}
                                className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-semibold transition-colors ${
                                    activeReport === r.key
                                        ? 'bg-indigo-600 border-indigo-600 text-white'
                                        : 'border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                                }`}
                            >
                                <i className={`fas ${r.icon} text-[10px]`}></i> {r.label}
                            </button>
                        ))}
                        {sortKey && (
                            <span className="text-[11px] text-slate-500 dark:text-slate-400 ml-1">
                                Sorted by <strong className="text-slate-700 dark:text-slate-200">{(COLUMNS.find(c => c.key === sortKey) || {}).label}</strong> ({sortDir === 'asc' ? 'low → high' : 'high → low'})
                            </span>
                        )}
                    </div>

                    {visibleProducts.length === 0 && (
                        <div className="py-10 text-center text-xs text-slate-500 dark:text-slate-400">No products match this view.</div>
                    )}

                    <div className="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-800">
                        <table className="w-full text-left text-xs">
                            <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 uppercase tracking-wider font-semibold border-b border-slate-200 dark:border-slate-800">
                                <tr>
                                    {sortKey && <th className="py-3.5 pl-4 pr-1 w-10 text-center">#</th>}
                                    {COLUMNS.map(col => {
                                        const isActive = sortKey === col.key;
                                        const justify = col.align === 'right' ? 'justify-end' : col.align === 'center' ? 'justify-center' : 'justify-start';
                                        return (
                                            <th
                                                key={col.key}
                                                aria-sort={isActive ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}
                                                className={`py-3.5 ${col.cls} text-${col.align}`}
                                            >
                                                <button
                                                    onClick={() => handleHeaderSort(col.key)}
                                                    title={`Sort by ${col.label}`}
                                                    className={`inline-flex items-center gap-1.5 uppercase tracking-wider font-semibold transition-colors ${justify} ${isActive ? 'text-indigo-600 dark:text-indigo-400' : 'hover:text-slate-800 dark:hover:text-slate-200'}`}
                                                >
                                                    {col.label}
                                                    <i className={`fas ${isActive ? (sortDir === 'asc' ? 'fa-sort-up' : 'fa-sort-down') : 'fa-sort'} text-[10px] ${isActive ? '' : 'opacity-40'}`}></i>
                                                </button>
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
                                {pg.pageItems.map((prod, idx) => {
                                    const netQty = prod.totalPurchasedQty - prod.totalReturnedQty;
                                    const returnRate = prod.totalPurchasedQty > 0 ? ((prod.totalReturnedQty / prod.totalPurchasedQty) * 100).toFixed(1) : 0;

                                    return (
                                        <tr key={pg.start + idx} className="hover:bg-slate-100/70 dark:hover:bg-slate-800/40">
                                            {sortKey && (
                                                <td className="py-3.5 pl-4 pr-1 text-center">
                                                    <span className={`inline-flex items-center justify-center min-w-[1.5rem] h-6 px-1.5 rounded-full text-[10px] font-bold ${
                                                        pg.start + idx < 3 ? 'bg-amber-400/20 text-amber-700 dark:text-amber-300 border border-amber-500/30' : 'text-slate-500 dark:text-slate-400'
                                                    }`}>{pg.start + idx + 1}</span>
                                                </td>
                                            )}
                                            <td className="py-3.5 px-4">
                                                <div className="font-bold text-slate-900 dark:text-white">{prod.name}</div>
                                                <div className="text-[10px] text-slate-500 dark:text-slate-400">{prod.category}</div>
                                            </td>
                                            <td className="py-3.5 px-3 font-mono text-slate-700 dark:text-slate-300">{prod.sku}</td>
                                            <td className="py-3.5 px-3 text-right text-slate-800 dark:text-slate-200">{formatCurrency(prod.unitPrice)}</td>
                                            <td className="py-3.5 px-3 text-right">
                                                {editingKey === (prod.sku || prod.name) ? (
                                                    <div className="flex items-center justify-end gap-1.5">
                                                        <input
                                                            type="number"
                                                            step="0.01"
                                                            autoFocus
                                                            value={editValue}
                                                            onChange={(e) => setEditValue(e.target.value)}
                                                            onKeyDown={(e) => { if (e.key === 'Enter') saveSrp(prod); if (e.key === 'Escape') cancelEditing(); }}
                                                            className="w-24 px-2 py-1 rounded-lg bg-slate-50 dark:bg-slate-950 border border-indigo-400 text-right text-xs focus:outline-none"
                                                        />
                                                        <button onClick={() => saveSrp(prod)} disabled={savingKey === (prod.sku || prod.name)} className="text-emerald-600 dark:text-emerald-400 hover:opacity-75">
                                                            <i className={`fas ${savingKey === (prod.sku || prod.name) ? 'fa-circle-notch fa-spin' : 'fa-check'}`}></i>
                                                        </button>
                                                        <button onClick={cancelEditing} className="text-slate-400 hover:text-rose-500">
                                                            <i className="fas fa-xmark"></i>
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div className="flex items-center justify-end gap-2">
                                                        <span className="text-slate-800 dark:text-slate-200">{prod.srp !== null && prod.srp !== undefined ? formatCurrency(prod.srp) : <span className="text-slate-400 dark:text-slate-600">—</span>}</span>
                                                        {isAdmin && (
                                                            <button onClick={() => startEditing(prod)} title="Edit SRP" className="text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400">
                                                                <i className="fas fa-pen text-[10px]"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                )}
                                            </td>
                                            <td className="py-3.5 px-3 text-center font-bold text-slate-900 dark:text-white">{prod.totalPurchasedQty}</td>
                                            <td className="py-3.5 px-3 text-center">
                                                {prod.totalReturnedQty > 0 ? (
                                                    <span className="text-rose-600 dark:text-rose-400 font-bold">{prod.totalReturnedQty}</span>
                                                ) : (
                                                    <span className="text-slate-400 dark:text-slate-600">0</span>
                                                )}
                                            </td>
                                            <td className="py-3.5 px-3 text-center">
                                                {prod.totalReturnedQty > 0 ? (
                                                    <span className="bg-rose-500/10 text-rose-700 dark:text-rose-300 border border-rose-500/20 px-2 py-0.5 rounded-full font-bold text-[10px]">
                                                        {returnRate}%
                                                    </span>
                                                ) : (
                                                    <span className="text-emerald-600 dark:text-emerald-400 text-[10px]">0%</span>
                                                )}
                                            </td>
                                            <td className="py-3.5 px-3 text-right font-bold text-emerald-600 dark:text-emerald-400 text-sm">
                                                {formatCurrency(prod.totalRevenue)}
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                        <Pagination pg={pg} label="products" />
                    </div>
                </div>
            );
        };

        // =====================================================================
        // Admin Panel (admin-only): manage invoices, customers, products and
        // user roles directly in the app — no need to open the Supabase dashboard.
        // Every write is also protected server-side by the is_admin() RLS policies.
        // =====================================================================
        const ADMIN_PAGE_SIZE = 25;
        const adminInput = 'w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500';
        const adminBtn = 'px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
        const adminBtnPrimary = `${adminBtn} bg-indigo-600 hover:bg-indigo-500 text-white`;
        const adminBtnGhost = `${adminBtn} border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800`;
        const adminBtnDanger = `${adminBtn} bg-rose-600 hover:bg-rose-500 text-white`;
        const adminTh = 'px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400 whitespace-nowrap';
        const adminTd = 'px-3 py-2 text-sm text-slate-800 dark:text-slate-200';
        const adminCard = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl shadow-sm';

        const adminSanitizeSearch = (s) => (s || '').trim().replace(/[,()%*\\]/g, ' ').trim();
        const adminNum = (v, fallback = null) => {
            if (v === '' || v === null || v === undefined) return fallback;
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };

        // Update that fails loudly if no row was changed (e.g. blocked by RLS).
        const adminUpdate = async (table, match, payload) => {
            let q = sb.from(table).update(payload);
            Object.entries(match).forEach(([k, v]) => { q = q.eq(k, v); });
            const { data, error } = await q.select();
            if (error) throw new Error(error.message);
            if (!data || data.length === 0) {
                throw new Error('No rows were updated. You may not have permission, or the record no longer exists.');
            }
            return data;
        };

        const adminDelete = async (table, match, expectRows = false) => {
            let q = sb.from(table).delete();
            Object.entries(match).forEach(([k, v]) => { q = q.eq(k, v); });
            const { data, error } = await q.select();
            if (error) throw new Error(error.message);
            if (expectRows && (!data || data.length === 0)) {
                throw new Error('Nothing was deleted. You may not have permission, or the record no longer exists.');
            }
            return data || [];
        };

        const useAdminDebounced = (value, ms = 350) => {
            const [v, setV] = React.useState(value);
            React.useEffect(() => {
                const t = setTimeout(() => setV(value), ms);
                return () => clearTimeout(t);
            }, [value, ms]);
            return v;
        };

        const AdminModal = ({ title, onClose, children, footer, wide }) => (
            <div className="fixed inset-0 flex items-start justify-center overflow-y-auto bg-black/50 p-4" style={{ zIndex: 50 }} onClick={onClose}>
                <div className={`${adminCard} w-full ${wide ? 'max-w-5xl' : 'max-w-lg'} my-6`} onClick={(e) => e.stopPropagation()}>
                    <div className="flex items-center justify-between px-5 py-4 border-b border-slate-200 dark:border-slate-800">
                        <h3 className="font-bold text-slate-900 dark:text-white">{title}</h3>
                        <button onClick={onClose} className="text-slate-400 hover:text-slate-700 dark:hover:text-white" title="Close">
                            <i className="fas fa-times"></i>
                        </button>
                    </div>
                    <div className="p-5">{children}</div>
                    {footer && (
                        <div className="px-5 py-4 border-t border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
                            {footer}
                        </div>
                    )}
                </div>
            </div>
        );

        const AdminConfirm = ({ title, children, confirmLabel = 'Delete', danger = true, busy, onConfirm, onCancel }) => (
            <div className="fixed inset-0 flex items-center justify-center bg-black/60 p-4" style={{ zIndex: 70 }} onClick={busy ? undefined : onCancel}>
                <div className={`${adminCard} w-full max-w-md p-5`} onClick={(e) => e.stopPropagation()}>
                    <h3 className="font-bold text-slate-900 dark:text-white">
                        <i className={`fas fa-triangle-exclamation mr-2 ${danger ? 'text-rose-500' : 'text-amber-500'}`}></i>{title}
                    </h3>
                    <div className="text-sm text-slate-600 dark:text-slate-300 mt-2 space-y-2">{children}</div>
                    <div className="flex justify-end gap-2 mt-5">
                        <button className={adminBtnGhost} onClick={onCancel} disabled={busy}>Cancel</button>
                        <button className={danger ? adminBtnDanger : adminBtnPrimary} onClick={onConfirm} disabled={busy}>
                            {busy ? 'Working...' : confirmLabel}
                        </button>
                    </div>
                </div>
            </div>
        );

        const AdminPager = ({ page, total, onPage }) => {
            const pages = Math.max(1, Math.ceil(total / ADMIN_PAGE_SIZE));
            return (
                <div className="flex items-center justify-between px-3 py-3 text-xs text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800">
                    <span>{total.toLocaleString()} record{total === 1 ? '' : 's'}</span>
                    <div className="flex items-center gap-2">
                        <button className={adminBtnGhost} disabled={page <= 0} onClick={() => onPage(page - 1)}>Prev</button>
                        <span>Page {page + 1} of {pages}</span>
                        <button className={adminBtnGhost} disabled={page + 1 >= pages} onClick={() => onPage(page + 1)}>Next</button>
                    </div>
                </div>
            );
        };

        const AdminField = ({ label, hint, children }) => (
            <label className="block">
                <span className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">{label}</span>
                {children}
                {hint && <span className="block text-[11px] text-slate-400 dark:text-slate-500 mt-1">{hint}</span>}
            </label>
        );

        const AdminSearchBar = ({ value, onChange, placeholder, right }) => (
            <div className="flex flex-wrap items-center gap-3 p-3 border-b border-slate-200 dark:border-slate-800">
                <div className="relative flex-1 min-w-[200px]">
                    <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input
                        className={`${adminInput} pl-9`}
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        placeholder={placeholder}
                    />
                </div>
                {right}
            </div>
        );

        // ---------------------------------------------------------------
        // Users & Roles
        // ---------------------------------------------------------------
        const UsersAdmin = ({ currentUserId, notify }) => {
            const [rows, setRows] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [busyId, setBusyId] = React.useState(null);
            const [confirm, setConfirm] = React.useState(null); // { row, role }
            const [pwdFor, setPwdFor] = React.useState(null); // profile row whose password is being set
            const [pwd, setPwd] = React.useState('');
            const [showPwd, setShowPwd] = React.useState(true);
            const [pwdBusy, setPwdBusy] = React.useState(false);

            const generatePwd = () => {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
                const arr = new Uint32Array(12);
                crypto.getRandomValues(arr);
                setPwd(Array.from(arr, n => chars[n % chars.length]).join(''));
                setShowPwd(true);
            };

            const closePwd = () => { if (!pwdBusy) { setPwdFor(null); setPwd(''); } };

            const savePwd = async () => {
                if (pwd.length < 8) { notify('Password must be at least 8 characters.', 'error'); return; }
                setPwdBusy(true);
                try {
                    const { data, error } = await sb.functions.invoke('admin-set-password', {
                        body: { userId: pwdFor.id, password: pwd }
                    });
                    if (error) {
                        let msg = error.message;
                        try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
                        throw new Error(msg);
                    }
                    if (data && data.error) throw new Error(data.error);
                    notify(`Password updated for ${pwdFor.email}.`);
                    setPwdFor(null);
                    setPwd('');
                } catch (err) {
                    notify(err.message, 'error');
                } finally {
                    setPwdBusy(false);
                }
            };

            const load = React.useCallback(async () => {
                const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: true });
                if (error) notify(error.message, 'error');
                else setRows(data || []);
                setLoading(false);
            }, [notify]);

            React.useEffect(() => { load(); }, [load]);

            const applyRole = async () => {
                const { row, role } = confirm;
                setBusyId(row.id);
                try {
                    await adminUpdate('profiles', { id: row.id }, { role });
                    notify(`${row.email} is now ${role === 'admin' ? 'an Admin' : 'Staff'}.`);
                    setConfirm(null);
                    await load();
                } catch (err) {
                    notify(err.message, 'error');
                } finally {
                    setBusyId(null);
                }
            };

            return (
                <div className={adminCard}>
                    <div className="p-4 border-b border-slate-200 dark:border-slate-800">
                        <p className="text-sm text-slate-600 dark:text-slate-300">
                            New sign-ups start as Staff. Promote someone to Admin to give them full access to this panel.
                            You can't change your own role, so you can never lock yourself out.
                        </p>
                    </div>
                    {loading ? (
                        <div className="p-10 text-center text-slate-400"><i className="fas fa-circle-notch fa-spin"></i></div>
                    ) : (
                        <div className="overflow-x-auto">
                            <table className="w-full">
                                <thead className="bg-slate-50 dark:bg-slate-800/50">
                                    <tr><th className={adminTh}>Email</th><th className={adminTh}>Role</th><th className={adminTh}>Joined</th><th className={adminTh}></th></tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {rows.map(row => {
                                        const isSelf = row.id === currentUserId;
                                        const isAdmin = row.role === 'admin';
                                        return (
                                            <tr key={row.id}>
                                                <td className={adminTd}>{row.email || '(no email)'} {isSelf && <span className="ml-1 text-[10px] text-slate-400">(you)</span>}</td>
                                                <td className={adminTd}>
                                                    <span className={`px-2 py-0.5 rounded-full text-[11px] font-semibold ${isAdmin ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}`}>
                                                        {isAdmin ? 'Admin' : 'Staff'}
                                                    </span>
                                                </td>
                                                <td className={adminTd}>{row.created_at ? new Date(row.created_at).toLocaleDateString() : ''}</td>
                                                <td className={`${adminTd} text-right whitespace-nowrap`}>
                                                    <button
                                                        className={`${adminBtnGhost} mr-2`}
                                                        onClick={() => { setPwdFor(row); setPwd(''); setShowPwd(true); }}
                                                    >
                                                        <i className="fas fa-key mr-1"></i> Set password
                                                    </button>
                                                    <button
                                                        className={isAdmin ? adminBtnGhost : adminBtnPrimary}
                                                        disabled={isSelf || busyId === row.id}
                                                        title={isSelf ? "You can't change your own role" : ''}
                                                        onClick={() => setConfirm({ row, role: isAdmin ? 'user' : 'admin' })}
                                                    >
                                                        {isAdmin ? 'Make Staff' : 'Make Admin'}
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}
                    {pwdFor && (
                        <AdminModal
                            title="Set password"
                            onClose={closePwd}
                            footer={
                                <React.Fragment>
                                    <span></span>
                                    <div className="flex gap-2">
                                        <button className={adminBtnGhost} onClick={closePwd} disabled={pwdBusy}>Cancel</button>
                                        <button className={adminBtnPrimary} onClick={savePwd} disabled={pwdBusy || pwd.length < 8}>{pwdBusy ? 'Saving...' : 'Set password'}</button>
                                    </div>
                                </React.Fragment>
                            }
                        >
                            <div className="space-y-3">
                                <p className="text-sm text-slate-600 dark:text-slate-300">
                                    Set a new password for <b>{pwdFor.email}</b>. Their current password stops working immediately. Passwords can't be viewed, only replaced.
                                </p>
                                <AdminField label="New password" hint="At least 8 characters. Share it with them privately.">
                                    <div className="flex gap-2">
                                        <input
                                            className={adminInput}
                                            type={showPwd ? 'text' : 'password'}
                                            autoComplete="new-password"
                                            value={pwd}
                                            onChange={(e) => setPwd(e.target.value)}
                                        />
                                        <button type="button" className={adminBtnGhost} onClick={() => setShowPwd(v => !v)} title={showPwd ? 'Hide' : 'Show'}>
                                            <i className={`fas ${showPwd ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                        <button type="button" className={adminBtnGhost} onClick={generatePwd}>Generate</button>
                                    </div>
                                </AdminField>
                            </div>
                        </AdminModal>
                    )}
                    {confirm && (
                        <AdminConfirm
                            title={confirm.role === 'admin' ? 'Grant admin access?' : 'Remove admin access?'}
                            confirmLabel={confirm.role === 'admin' ? 'Make Admin' : 'Make Staff'}
                            danger={confirm.role !== 'admin'}
                            busy={busyId === confirm.row.id}
                            onConfirm={applyRole}
                            onCancel={() => setConfirm(null)}
                        >
                            <p>
                                {confirm.role === 'admin'
                                    ? <span><b>{confirm.row.email}</b> will be able to edit and delete invoices, customers and products, and change other users' roles.</span>
                                    : <span><b>{confirm.row.email}</b> will lose access to the Admin panel and admin-only actions.</span>}
                            </p>
                        </AdminConfirm>
                    )}
                </div>
            );
        };

        // ---------------------------------------------------------------
        // Invoices
        // ---------------------------------------------------------------
        const AdminItemRow = ({ item, onSave, onDelete, disabled }) => {
            const [qty, setQty] = React.useState(String(item.qty ?? 0));
            const [price, setPrice] = React.useState(String(item.unit_price ?? 0));
            const [disc, setDisc] = React.useState(String(item.discount_percent ?? 0));
            const [ret, setRet] = React.useState(String(item.returned_qty ?? 0));
            React.useEffect(() => {
                setQty(String(item.qty ?? 0)); setPrice(String(item.unit_price ?? 0));
                setDisc(String(item.discount_percent ?? 0)); setRet(String(item.returned_qty ?? 0));
            }, [item.qty, item.unit_price, item.discount_percent, item.returned_qty]);

            const dirty = qty !== String(item.qty ?? 0) || price !== String(item.unit_price ?? 0)
                || disc !== String(item.discount_percent ?? 0) || ret !== String(item.returned_qty ?? 0);
            const cell = 'px-2 py-1.5 w-full text-sm rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100';

            return (
                <tr>
                    <td className={adminTd}>
                        <div className="font-medium">{item.products?.name || item.product_id || '(no product)'}</div>
                        <div className="text-[11px] text-slate-400">{item.products?.sku || item.product_id || ''}</div>
                    </td>
                    <td className="px-2 py-1.5 w-20"><input className={cell} type="number" min="0" value={qty} onChange={(e) => setQty(e.target.value)} /></td>
                    <td className="px-2 py-1.5 w-28"><input className={cell} type="number" min="0" step="0.01" value={price} onChange={(e) => setPrice(e.target.value)} /></td>
                    <td className="px-2 py-1.5 w-20"><input className={cell} type="number" min="0" max="100" step="0.01" value={disc} onChange={(e) => setDisc(e.target.value)} /></td>
                    <td className="px-2 py-1.5 w-20"><input className={cell} type="number" min="0" value={ret} onChange={(e) => setRet(e.target.value)} /></td>
                    <td className={`${adminTd} text-right whitespace-nowrap`}>
                        <button className={adminBtnPrimary} disabled={!dirty || disabled} onClick={() => onSave(item, { qty, price, disc, ret })}>Save</button>
                        <button className={`${adminBtnDanger} ml-1`} disabled={disabled} onClick={() => onDelete(item)} title="Delete line item"><i className="fas fa-trash"></i></button>
                    </td>
                </tr>
            );
        };

        const AdminAddItem = ({ invoiceId, notify, onAdded }) => {
            const [open, setOpen] = React.useState(false);
            const [qInput, setQInput] = React.useState('');
            const q = useAdminDebounced(qInput);
            const [results, setResults] = React.useState([]);
            const [picked, setPicked] = React.useState(null);
            const [qty, setQty] = React.useState('1');
            const [price, setPrice] = React.useState('');
            const [disc, setDisc] = React.useState('0');
            const [saving, setSaving] = React.useState(false);

            React.useEffect(() => {
                const term = adminSanitizeSearch(q);
                if (!open || picked || term.length < 2) { setResults([]); return; }
                let cancelled = false;
                sb.from('products')
                    .select('id, name, sku, srp')
                    .or(`name.ilike.%${term}%,sku.ilike.%${term}%`)
                    .order('name')
                    .limit(15)
                    .then(({ data, error }) => { if (!cancelled) setResults(error ? [] : (data || [])); });
                return () => { cancelled = true; };
            }, [q, open, picked]);

            const reset = () => {
                setOpen(false); setQInput(''); setResults([]); setPicked(null);
                setQty('1'); setPrice(''); setDisc('0');
            };

            const pick = (p) => {
                setPicked(p);
                setPrice(p.srp !== null && p.srp !== undefined ? String(p.srp) : '');
            };

            const add = async () => {
                const nQty = adminNum(qty), nPrice = adminNum(price), nDisc = adminNum(disc, 0);
                if (!picked) { notify('Pick a product first.', 'error'); return; }
                if (nQty === null || !Number.isInteger(nQty) || nQty < 1) { notify('Quantity must be a whole number (1 or more).', 'error'); return; }
                if (nPrice === null || nPrice < 0) { notify('Enter a unit price (0 or more).', 'error'); return; }
                if (nDisc < 0 || nDisc > 100) { notify('Discount must be between 0 and 100.', 'error'); return; }
                setSaving(true);
                try {
                    const { error } = await sb.from('invoice_items').insert({
                        invoice_id: invoiceId,
                        product_id: picked.id,
                        unit_price: nPrice,
                        qty: nQty,
                        discount_percent: nDisc,
                        returned_qty: 0
                    });
                    if (error) throw new Error(error.message);
                    notify(`Added ${picked.name} to ${invoiceId}.`);
                    reset();
                    onAdded();
                } catch (err) {
                    notify(err.message, 'error');
                } finally {
                    setSaving(false);
                }
            };

            if (!open) {
                return (
                    <div className="mt-2">
                        <button className={adminBtnPrimary} onClick={() => setOpen(true)}><i className="fas fa-plus mr-1"></i> Add line item</button>
                    </div>
                );
            }

            return (
                <div className="mt-3 p-4 rounded-lg border border-indigo-200 dark:border-indigo-500/30 bg-indigo-50/50 dark:bg-indigo-500/5 space-y-3">
                    <div className="text-xs font-semibold text-slate-700 dark:text-slate-300">Add line item</div>
                    {picked ? (
                        <div className="flex items-center justify-between gap-2 px-3 py-2 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                            <div className="min-w-0">
                                <div className="text-sm font-medium text-slate-900 dark:text-slate-100 truncate">{picked.name}</div>
                                <div className="text-[11px] text-slate-400">{picked.sku || picked.id}</div>
                            </div>
                            <button className={adminBtnGhost} onClick={() => { setPicked(null); setPrice(''); }}>Change</button>
                        </div>
                    ) : (
                        <div>
                            <input
                                className={adminInput}
                                autoFocus
                                placeholder="Search product by name or SKU (at least 2 letters)..."
                                value={qInput}
                                onChange={(e) => setQInput(e.target.value)}
                            />
                            {results.length > 0 && (
                                <div className="mt-1 max-h-56 overflow-y-auto rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 divide-y divide-slate-100 dark:divide-slate-800">
                                    {results.map(p => (
                                        <button
                                            key={p.id}
                                            type="button"
                                            onClick={() => pick(p)}
                                            className="w-full text-left px-3 py-2 hover:bg-slate-50 dark:hover:bg-slate-800"
                                        >
                                            <div className="text-sm text-slate-900 dark:text-slate-100">{p.name}</div>
                                            <div className="text-[11px] text-slate-400">
                                                {p.sku || p.id}{p.srp !== null && p.srp !== undefined ? ` • SRP ₱${Number(p.srp).toLocaleString()}` : ''}
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}
                            {adminSanitizeSearch(q).length >= 2 && results.length === 0 && (
                                <p className="text-[11px] text-slate-400 mt-1">No matching products. If it's a new product, add it first in the Products section.</p>
                            )}
                        </div>
                    )}
                    <div className="grid grid-cols-3 gap-3">
                        <AdminField label="Qty"><input type="number" min="1" className={adminInput} value={qty} onChange={(e) => setQty(e.target.value)} /></AdminField>
                        <AdminField label="Unit price (₱)"><input type="number" min="0" step="0.01" className={adminInput} value={price} onChange={(e) => setPrice(e.target.value)} /></AdminField>
                        <AdminField label="Discount %"><input type="number" min="0" max="100" step="0.01" className={adminInput} value={disc} onChange={(e) => setDisc(e.target.value)} /></AdminField>
                    </div>
                    <div className="flex justify-end gap-2">
                        <button className={adminBtnGhost} onClick={reset} disabled={saving}>Cancel</button>
                        <button className={adminBtnPrimary} onClick={add} disabled={saving || !picked}>{saving ? 'Adding...' : 'Add to invoice'}</button>
                    </div>
                </div>
            );
        };

        const InvoiceEditor = ({ invoiceId, customers, notify, onClose, onChanged, onRenamed }) => {
            const [loading, setLoading] = React.useState(true);
            const [inv, setInv] = React.useState(null);
            const [f, setF] = React.useState({});
            const [branches, setBranches] = React.useState([]);
            const [custFilter, setCustFilter] = React.useState('');
            const [saving, setSaving] = React.useState(false);
            const [confirm, setConfirm] = React.useState(null); // { kind, ... }
            const [busy, setBusy] = React.useState(false);

            const load = React.useCallback(async (resetForm) => {
                const { data, error } = await sb
                    .from('invoices')
                    .select('*, invoice_items(*, products(name, sku)), returns(*)')
                    .eq('id', invoiceId)
                    .maybeSingle();
                if (error || !data) {
                    notify(error ? error.message : 'Invoice not found.', 'error');
                    onClose();
                    return;
                }
                setInv(data);
                if (resetForm) {
                    setF({
                        id: data.id,
                        branch: data.branch || '',
                        invoice_date: data.invoice_date || '',
                        payment_method: data.payment_method || '',
                        status: data.status || '',
                        tax_rate: data.tax_rate ?? '',
                        cwt_2307_rate: data.cwt_2307_rate ?? '',
                        atc_code: data.atc_code || '',
                        notes: data.notes || '',
                        sales_rep: data.sales_rep || '',
                        customer_id: data.customer_id || ''
                    });
                }
                setLoading(false);
            }, [invoiceId, notify, onClose]);

            React.useEffect(() => { load(true); }, [invoiceId]);
            React.useEffect(() => {
                sb.from('branches').select('name').order('name').then(({ data }) => setBranches((data || []).map(b => b.name)));
            }, []);

            const set = (k) => (e) => setF(prev => ({ ...prev, [k]: e.target.value }));

            const customerOptions = React.useMemo(() => {
                const term = custFilter.trim().toLowerCase();
                let list = customers;
                if (term) {
                    list = customers.filter(c => (`${c.name} ${c.id} ${c.email} ${c.company}`).toLowerCase().includes(term));
                }
                list = list.slice(0, 200);
                if (f.customer_id && !list.some(c => c.id === f.customer_id)) {
                    const cur = customers.find(c => c.id === f.customer_id);
                    if (cur) list = [cur, ...list];
                }
                return list;
            }, [customers, custFilter, f.customer_id]);

            const saveInvoice = async () => {
                if (!f.invoice_date) { notify('Invoice date is required.', 'error'); return; }
                const newId = (f.id || '').trim();
                if (!newId) { notify('Invoice number is required.', 'error'); return; }
                const renamed = newId !== invoiceId;
                setSaving(true);
                try {
                    await adminUpdate('invoices', { id: invoiceId }, {
                        ...(renamed ? { id: newId } : {}),
                        branch: f.branch || null,
                        invoice_date: f.invoice_date,
                        payment_method: f.payment_method || null,
                        status: f.status || 'Paid',
                        tax_rate: adminNum(f.tax_rate, 12),
                        cwt_2307_rate: adminNum(f.cwt_2307_rate, 0),
                        atc_code: f.atc_code || null,
                        notes: f.notes || null,
                        sales_rep: f.sales_rep || null,
                        customer_id: f.customer_id || null
                    });
                    notify(renamed ? `Invoice renamed to ${newId} and saved.` : `Invoice ${invoiceId} saved.`);
                    onChanged();
                    if (renamed) { onRenamed(newId); } else { await load(true); }
                } catch (err) {
                    const dup = /duplicate key|already exists/i.test(err.message || '');
                    notify(dup ? `Invoice number ${newId} already exists. Choose a different number.` : err.message, 'error');
                } finally {
                    setSaving(false);
                }
            };

            const saveItem = async (item, v) => {
                const qty = adminNum(v.qty), price = adminNum(v.price), disc = adminNum(v.disc, 0), ret = adminNum(v.ret, 0);
                if (qty === null || !Number.isInteger(qty) || qty < 0) { notify('Quantity must be a whole number (0 or more).', 'error'); return; }
                if (price === null || price < 0) { notify('Unit price must be a number (0 or more).', 'error'); return; }
                if (disc < 0 || disc > 100) { notify('Discount must be between 0 and 100.', 'error'); return; }
                if (!Number.isInteger(ret) || ret < 0 || ret > qty) { notify('Returned qty must be a whole number between 0 and the quantity.', 'error'); return; }
                try {
                    await adminUpdate('invoice_items', { id: item.id }, { qty, unit_price: price, discount_percent: disc, returned_qty: ret });
                    notify('Line item saved.');
                    onChanged();
                    await load(false);
                } catch (err) {
                    notify(err.message, 'error');
                }
            };

            const runConfirmed = async () => {
                setBusy(true);
                try {
                    if (confirm.kind === 'item') {
                        await adminDelete('returns', { invoice_item_id: confirm.item.id });
                        await adminDelete('invoice_items', { id: confirm.item.id }, true);
                        notify('Line item deleted.');
                        await load(false);
                    } else if (confirm.kind === 'return') {
                        const r = confirm.ret;
                        await adminDelete('returns', { id: r.id }, true);
                        const item = (inv.invoice_items || []).find(i => i.id === r.invoice_item_id);
                        if (item) {
                            await adminUpdate('invoice_items', { id: item.id }, { returned_qty: Math.max(0, (item.returned_qty || 0) - (r.qty || 0)) });
                        }
                        notify('Return deleted. Review the invoice Status if needed.');
                        await load(false);
                    } else if (confirm.kind === 'invoice') {
                        await adminDelete('returns', { invoice_id: invoiceId });
                        await adminDelete('invoice_items', { invoice_id: invoiceId });
                        await adminDelete('invoices', { id: invoiceId }, true);
                        notify(`Invoice ${invoiceId} deleted.`);
                        onChanged();
                        onClose();
                        return;
                    }
                    onChanged();
                    setConfirm(null);
                } catch (err) {
                    notify(err.message, 'error');
                } finally {
                    setBusy(false);
                }
            };

            const items = inv?.invoice_items || [];
            const rets = inv?.returns || [];

            return (
                <React.Fragment>
                    <AdminModal
                        wide
                        title={`Edit invoice ${invoiceId}`}
                        onClose={onClose}
                        footer={!loading && (
                            <React.Fragment>
                                <button className={adminBtnDanger} onClick={() => setConfirm({ kind: 'invoice' })}>
                                    <i className="fas fa-trash mr-1"></i> Delete invoice
                                </button>
                                <div className="flex gap-2">
                                    <button className={adminBtnGhost} onClick={onClose}>Close</button>
                                    <button className={adminBtnPrimary} onClick={saveInvoice} disabled={saving}>{saving ? 'Saving...' : 'Save invoice details'}</button>
                                </div>
                            </React.Fragment>
                        )}
                    >
                        {loading ? (
                            <div className="p-10 text-center text-slate-400"><i className="fas fa-circle-notch fa-spin"></i></div>
                        ) : (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    <div className="sm:col-span-2 lg:col-span-3">
                                        <AdminField label="Invoice number" hint="Changing this also updates the invoice's line items and returns. Copies already printed or sent keep the old number.">
                                            <input className={`${adminInput} sm:max-w-sm font-semibold`} value={f.id || ''} onChange={set('id')} />
                                        </AdminField>
                                    </div>
                                    <AdminField label="Invoice date">
                                        <input type="date" className={adminInput} value={f.invoice_date} onChange={set('invoice_date')} />
                                    </AdminField>
                                    <AdminField label="Branch">
                                        <select className={adminInput} value={f.branch} onChange={set('branch')}>
                                            <option value="">(none)</option>
                                            {f.branch && !branches.includes(f.branch) && <option value={f.branch}>{f.branch}</option>}
                                            {branches.map(b => <option key={b} value={b}>{b}</option>)}
                                        </select>
                                    </AdminField>
                                    <AdminField label="Sales rep">
                                        <input className={adminInput} value={f.sales_rep} onChange={set('sales_rep')} />
                                    </AdminField>
                                    <AdminField label="Payment method">
                                        <input className={adminInput} list="admin-pay-methods" value={f.payment_method} onChange={set('payment_method')} />
                                        <datalist id="admin-pay-methods">
                                            <option value="Cash" /><option value="Card" /><option value="Check/Online" /><option value="A/R" />
                                        </datalist>
                                    </AdminField>
                                    <AdminField label="Status">
                                        <input className={adminInput} list="admin-statuses" value={f.status} onChange={set('status')} />
                                        <datalist id="admin-statuses">
                                            <option value="Paid" /><option value="Paid (Partially Returned)" />
                                        </datalist>
                                    </AdminField>
                                    <AdminField label="VAT rate (%)">
                                        <input type="number" step="0.01" className={adminInput} value={f.tax_rate} onChange={set('tax_rate')} />
                                    </AdminField>
                                    <AdminField label="BIR 2307 rate (%)" hint="0 = not applicable">
                                        <input type="number" step="0.01" className={adminInput} value={f.cwt_2307_rate} onChange={set('cwt_2307_rate')} />
                                    </AdminField>
                                    <AdminField label="ATC code">
                                        <input className={adminInput} value={f.atc_code} onChange={set('atc_code')} />
                                    </AdminField>
                                    <div className="sm:col-span-2 lg:col-span-3">
                                        <AdminField label="Customer" hint="Type to filter the list, then pick a customer.">
                                            <div className="flex flex-col sm:flex-row gap-2">
                                                <input className={`${adminInput} sm:max-w-xs`} placeholder="Filter customers..." value={custFilter} onChange={(e) => setCustFilter(e.target.value)} />
                                                <select className={adminInput} value={f.customer_id} onChange={set('customer_id')}>
                                                    <option value="">(no customer)</option>
                                                    {customerOptions.map(c => (
                                                        <option key={c.id} value={c.id}>{c.name}{c.company ? ` — ${c.company}` : ''} ({c.id})</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </AdminField>
                                    </div>
                                    <div className="sm:col-span-2 lg:col-span-3">
                                        <AdminField label="Notes">
                                            <textarea rows="2" className={adminInput} value={f.notes} onChange={set('notes')} />
                                        </AdminField>
                                    </div>
                                </div>

                                <div>
                                    <h4 className="text-sm font-bold text-slate-900 dark:text-white mb-2">Line items ({items.length})</h4>
                                    <div className="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-lg">
                                        <table className="w-full">
                                            <thead className="bg-slate-50 dark:bg-slate-800/50">
                                                <tr>
                                                    <th className={adminTh}>Product</th><th className={adminTh}>Qty</th><th className={adminTh}>Unit price</th>
                                                    <th className={adminTh}>Disc %</th><th className={adminTh}>Returned</th><th className={adminTh}></th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                                {items.map(item => (
                                                    <AdminItemRow
                                                        key={item.id}
                                                        item={item}
                                                        onSave={saveItem}
                                                        onDelete={(it) => setConfirm({ kind: 'item', item: it })}
                                                    />
                                                ))}
                                                {items.length === 0 && (
                                                    <tr><td colSpan="6" className="px-3 py-6 text-center text-sm text-slate-400">No line items.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    <AdminAddItem
                                        invoiceId={invoiceId}
                                        notify={notify}
                                        onAdded={() => { onChanged(); load(false); }}
                                    />
                                </div>

                                <div>
                                    <h4 className="text-sm font-bold text-slate-900 dark:text-white mb-2">Returns / credit notes ({rets.length})</h4>
                                    {rets.length === 0 ? (
                                        <p className="text-sm text-slate-400">No returns on this invoice.</p>
                                    ) : (
                                        <div className="overflow-x-auto border border-slate-200 dark:border-slate-800 rounded-lg">
                                            <table className="w-full">
                                                <thead className="bg-slate-50 dark:bg-slate-800/50">
                                                    <tr>
                                                        <th className={adminTh}>Credit note</th><th className={adminTh}>Date</th><th className={adminTh}>Qty</th>
                                                        <th className={adminTh}>Reason</th><th className={adminTh}>Refund</th><th className={adminTh}></th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                                    {rets.map(r => (
                                                        <tr key={r.id}>
                                                            <td className={adminTd}>{r.credit_note_no || r.id}</td>
                                                            <td className={adminTd}>{r.return_date}</td>
                                                            <td className={adminTd}>{r.qty}</td>
                                                            <td className={adminTd}>{r.reason || ''}</td>
                                                            <td className={adminTd}>{r.refund_method || ''}</td>
                                                            <td className={`${adminTd} text-right`}>
                                                                <button className={adminBtnDanger} onClick={() => setConfirm({ kind: 'return', ret: r })} title="Delete return"><i className="fas fa-trash"></i></button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </AdminModal>

                    {confirm && (
                        <AdminConfirm

        // ---------------------------------------------------------------
        const ACTIVITY_TABLE_LABELS = {
            invoices: 'Invoice', invoice_items: 'Invoice item', returns: 'Return', customers: 'Customer',
            products: 'Product', profiles: 'User / role', branches: 'Branch', app: 'App', auth: 'Password'
        };
        const ACTIVITY_ACTION_LABELS = {
            INSERT: 'Created', UPDATE: 'Updated', DELETE: 'Deleted', LOGIN: 'Signed in',
            EXPORT_CSV: 'Exported CSV', PRINT_INVOICE: 'Printed invoice', SET_PASSWORD: 'Set password'
        };
        const ACTIVITY_ACTION_STYLE = {
            INSERT: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300',
            UPDATE: 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300',
            DELETE: 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300',
            LOGIN: 'bg-sky-100 text-sky-700 dark:bg-sky-500/20 dark:text-sky-300',
            EXPORT_CSV: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300',
            PRINT_INVOICE: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300',
            SET_PASSWORD: 'bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300'
        };
        const activityValue = (v) => {
            if (v === null || v === undefined || v === '') return '—';
            if (typeof v === 'object') return JSON.stringify(v);
            return String(v);
        };
        const activityWhat = (r) => {
            const label = ACTIVITY_TABLE_LABELS[r.table_name] || r.table_name || '';
            if (r.table_name === 'app') return r.record_id ? `${label} • ${r.record_id}` : label;
            if (r.parent_id) return `${label} in ${r.parent_id}`;
            return r.record_id ? `${label} ${r.record_id}` : label;
        };

        const ActivityDetail = ({ row, onClose }) => {
            const oldD = row.old_data || {};
            const newD = row.new_data || {};
            const keys = row.action === 'UPDATE'
                ? Object.keys(newD)
                : Object.keys(row.action === 'DELETE' ? oldD : newD);
            return (
                <AdminModal title={`${ACTIVITY_ACTION_LABELS[row.action] || row.action} — ${activityWhat(row)}`} onClose={onClose} wide>
                    <div className="text-xs text-slate-500 dark:text-slate-400 mb-3">
                        {new Date(row.created_at).toLocaleString()} • {row.actor_email || 'Unknown'}{row.actor_role ? ` (${row.actor_role === 'admin' ? 'Admin' : 'Staff'})` : ''}
                    </div>
                    {row.summary && row.action !== 'UPDATE' && row.action !== 'INSERT' && row.action !== 'DELETE' && (
                        <p className="text-sm text-slate-700 dark:text-slate-200 mb-3">{row.summary}</p>
                    )}
                    {keys.length > 0 ? (

        // ---------------------------------------------------------------

        const AdminPanel = ({ currentUserId, customers, onDataChanged }) => {
