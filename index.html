        const App = ({ user, profile, onLogout }) => {
            const [invoices, setInvoices] = React.useState([]);
            const [products, setProducts] = React.useState([]);
            const [dbCustomers, setDbCustomers] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);
            const [loadError, setLoadError] = React.useState('');
            const [activeTab, setActiveTab] = React.useState('ledger');
            // Keep-alive tabs: once a tab has been opened it stays mounted (just hidden) so
            // anything typed in it (search boxes, local filters) survives switching tabs.
            const [visitedTabs, setVisitedTabs] = React.useState({});
            React.useEffect(() => {
                setVisitedTabs(v => (v[activeTab] ? v : { ...v, [activeTab]: true }));
            }, [activeTab]);
            const tabMounted = (id) => activeTab === id || !!visitedTabs[id];
            const tabStyle = (id) => (activeTab === id ? undefined : { display: 'none' });
            const [selectedInvoice, setSelectedInvoice] = React.useState(null);
            const [returnModalInvoice, setReturnModalInvoice] = React.useState(null);
            const [isNewModalOpen, setIsNewModalOpen] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState('');
            // Admin: invoice currently open in the Edit Invoice window (opened from the invoice view).
            const [adminEditInvoiceId, setAdminEditInvoiceId] = React.useState(null);
            const adminNotify = React.useCallback((text, type = 'success') => {
                setToastMessage(type === 'error' ? `Error: ${text}` : text);
                setTimeout(() => setToastMessage(''), type === 'error' ? 8000 : 4000);
            }, []);
            const [theme, setTheme] = React.useState('light'); // 'light' (default / daytime) or 'dark' (night mode)

            // Loads the product catalog once for the item autocomplete.
            React.useEffect(() => {
                fetchProductsFromSupabase().then(setProducts).catch(err => console.error(err));
            }, []);

            // Loads the customers table — the source of truth for the customer
            // autocomplete + auto-fill, kept in sync every time an invoice is saved.
            const reloadCustomers = React.useCallback(async () => {
                try {
                    const data = await fetchCustomersFromSupabase();
                    setDbCustomers(data);
                } catch (err) {
                    console.error(err);
                }
            }, []);

            React.useEffect(() => { reloadCustomers(); }, [reloadCustomers]);

            // Flat list of every credit note (return) across all invoices, enriched with its
            // origin invoice, its VAT-inclusive face value, and how much of it has already
            // been redeemed via `applications`. This is the single source of truth for
            // "how much credit does this customer have available right now".
            //
            // IMPORTANT: one physical Credit Note can cover 2+ different returned line
            // items (e.g. a customer returns a monitor AND a keyboard in one visit, both
            // under CN-2026-045). Each returned item is still its own row in the
            // `returns` table, but they must behave as ONE redeemable credit note, not
            // as several separate ones that happen to share the same visible CN number.
            // So we group return rows by (origin invoice + credit note number) before
            // exposing them anywhere balances or the "Apply Credit Note" pickers read from.
            const allCreditNotes = React.useMemo(() => {
                const flat = [];
                invoices.forEach(inv => {
                    (inv.returns || []).forEach(ret => {
                        const creditAmount = calculateCreditNoteValue(ret);
                        const applications = ret.applications || [];
                        const appliedAmount = applications.reduce((s, a) => s + (a.amount || 0), 0);
                        flat.push({
                            ...ret,
                            originInvoiceId: inv.id,
                            originBranch: inv.branch,
                            customerName: inv.customer?.name || '',
                            customerEmail: (inv.customer?.email || '').trim().toLowerCase(),
                            customerKey: getCreditMatchKey(inv.customer || {}),
                            applications,
                            creditAmount,
                            appliedAmount
                        });
                    });
                });

                const groupOrder = [];
                const groups = {};
                flat.forEach(ret => {
                    const cnNo = (ret.creditNoteNo || '').trim() || ret.id;
                    const groupKey = `${ret.originInvoiceId}::${cnNo}`;
                    if (!groups[groupKey]) {
                        groups[groupKey] = {
                            id: ret.id, // representative row — new redemptions get recorded against this one
                            creditNoteNo: ret.creditNoteNo,
                            date: ret.date,
                            originInvoiceId: ret.originInvoiceId,
                            originBranch: ret.originBranch,
                            customerName: ret.customerName,
                            customerEmail: ret.customerEmail,
                            customerKey: ret.customerKey,
                            refundMethod: ret.refundMethod,
                            items: [], // every returned line item this credit note actually covers
                            applications: [],
                            creditAmount: 0,
                            appliedAmount: 0
                        };
                        groupOrder.push(groupKey);
                    }
                    const g = groups[groupKey];
                    g.items.push({ itemName: ret.itemName, qty: ret.qty, reason: ret.reason, creditAmount: ret.creditAmount });
                    g.applications = g.applications.concat(ret.applications);
                    g.creditAmount += ret.creditAmount;
                    g.appliedAmount += ret.appliedAmount;
                });

                return groupOrder.map(k => {
                    const g = groups[k];
                    const isRefunded = isCashRefund(g.refundMethod);
                    const remainingBalance = isRefunded ? 0 : Math.max(0, g.creditAmount - g.appliedAmount);
                    return {
                        ...g,
                        isRefunded,
                        remainingBalance,
                        status: isRefunded ? 'Refunded' : (g.appliedAmount <= 0 ? 'Open' : (remainingBalance > 0.01 ? 'Partially Applied' : 'Applied'))
                    };
                });
            }, [invoices]);

            // invoiceId -> total credit note value redeemed against that invoice.
            const creditAppliedByInvoiceId = React.useMemo(() => {
                const map = {};
                allCreditNotes.forEach(cn => {
                    (cn.applications || []).forEach(a => {
                        map[a.invoiceId] = (map[a.invoiceId] || 0) + (a.amount || 0);
                        if (!map[`${a.invoiceId}__notes`]) map[`${a.invoiceId}__notes`] = [];
                        map[`${a.invoiceId}__notes`].push({ creditNoteNo: cn.creditNoteNo, amount: a.amount });
                    });
                });
                return map;
            }, [allCreditNotes]);

            // customerKey (email-or-name) -> total open/unredeemed credit balance available to spend.
            const creditNotesByEmail = React.useMemo(() => {
                const map = {};
                allCreditNotes.forEach(cn => {
                    if (!cn.customerKey || cn.remainingBalance <= 0) return;
                    map[cn.customerKey] = (map[cn.customerKey] || 0) + cn.remainingBalance;
                });
                return map;
            }, [allCreditNotes]);

            // Invoices enriched with how much credit-note value has been redeemed against
            // each of them — this is what actually reduces an invoice's net payable now,
            // never the returns that originated on that same invoice.
            const enrichedInvoices = React.useMemo(() => {
                return invoices.map(inv => ({
                    ...inv,
                    creditAppliedAmount: creditAppliedByInvoiceId[inv.id] || 0,
                    appliedCreditNotes: creditAppliedByInvoiceId[`${inv.id}__notes`] || []
                }));
            }, [invoices, creditAppliedByInvoiceId]);

            // Customer list for the autocomplete + auto-fill: the `customers` table is the
            // source of truth (kept in sync on every invoice save), with any customer seen
            // only on an older invoice (saved before this table existed) folded in too, so
            // nobody "disappears" from autocomplete just because a migration ran later.
            const customers = React.useMemo(() => {
                const map = new Map();
                dbCustomers.forEach(c => { if (c.name) map.set(c.name.toLowerCase(), c); });
                invoices.forEach(inv => {
                    const c = inv.customer;
                    const key = c && c.name ? c.name.toLowerCase() : null;
                    if (key && !map.has(key)) map.set(key, c);
                });
                return Array.from(map.values());
            }, [dbCustomers, invoices]);

            // Lookup by id (not name) — used by the Customer Profiles tab to show each
            // customer's canonical record from the `customers` table, keyed off the
            // customer_id every new invoice now links to.
            const customersById = React.useMemo(() => {
                const map = {};
                dbCustomers.forEach(c => { map[c.id] = c; });
                return map;
            }, [dbCustomers]);

            // Product catalog enriched with each product's most recently sold
            // price (price itself lives per invoice line, not on the catalog
            // row) — powers the item name autocomplete + auto-fill.
            const productCatalog = React.useMemo(() => {
                const priceByProductId = new Map();
                const dateByProductId = new Map();
                invoices.forEach(inv => {
                    inv.items.forEach(item => {
                        if (!item.productId) return;
                        const prevDate = dateByProductId.get(item.productId);
                        if (!prevDate || inv.date > prevDate) {
                            dateByProductId.set(item.productId, inv.date);
                            priceByProductId.set(item.productId, item.unitPrice);
                        }
                    });
                });
                return products.map(p => ({ ...p, lastPrice: priceByProductId.has(p.id) ? priceByProductId.get(p.id) : null }));
            }, [products, invoices]);

            React.useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
            }, [theme]);

            const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));

            // Pulls the latest invoices (with branches/customers/items/returns
            // joined in) from Supabase and refreshes local state.
            const reloadInvoices = React.useCallback(async () => {
                try {
                    const data = await fetchInvoicesFromSupabase();
                    setInvoices(data);
                    setSelectedInvoice(prev => (prev ? data.find(inv => inv.id === prev.id) || null : prev));
                    setLoadError('');
                } catch (err) {
                    console.error(err);
                    setLoadError(err.message || 'Failed to load data from Supabase.');
                }
            }, []);

            React.useEffect(() => {
                setIsLoading(true);
                reloadInvoices().finally(() => setIsLoading(false));
            }, [reloadInvoices]);

            // Live sync: whenever a row changes in Supabase (from this app, another staff
            // member, or edited directly in the Supabase dashboard), quietly re-pull the data.
            // Changes arrive in bursts (e.g. one invoice = 1 invoice row + several item rows),
            // so we wait ~600ms after the last event and reload once.
            // Requires Realtime to be enabled on these tables in Supabase.
            const [liveStatus, setLiveStatus] = React.useState('connecting'); // 'connecting' | 'live' | 'offline'

            React.useEffect(() => {
                let timer = null;
                const refreshAll = () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        reloadInvoices();
                        reloadCustomers();
                        fetchProductsFromSupabase().then(setProducts).catch(err => console.error(err));
                    }, 600);
                };

                const channel = sb.channel('ledger-live-sync');
                ['invoices', 'invoice_items', 'returns', 'customers', 'products', 'branches'].forEach(table => {
                    channel.on('postgres_changes', { event: '*', schema: 'public', table }, refreshAll);
                });
                channel.subscribe((status) => {
                    if (status === 'SUBSCRIBED') setLiveStatus('live');
                    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setLiveStatus('offline');
                });

                // Safety net: if the tab was in the background (or the connection dropped),
                // catch up as soon as the person comes back to it.
                const onVisible = () => { if (document.visibilityState === 'visible') refreshAll(); };
                document.addEventListener('visibilitychange', onVisible);

                return () => {
                    clearTimeout(timer);
                    document.removeEventListener('visibilitychange', onVisible);
                    sb.removeChannel(channel);
                };
            }, [reloadInvoices, reloadCustomers]);

            // Admin panel: refresh every dataset after an admin edit.
            const refreshAllData = React.useCallback(() => {
                reloadInvoices();
                reloadCustomers();
                fetchProductsFromSupabase().then(setProducts).catch(err => console.error(err));
            }, [reloadInvoices, reloadCustomers]);

            const [filters, setFilters] = React.useState({
                search: '',
                paymentMethod: 'ALL',
                cwtFilter: 'ALL',
                vatFilter: 'ALL',
                branch: 'ALL',
                salesRep: 'ALL',
                returnFilter: 'ALL',
                dateFrom: '',
                dateTo: ''
            });

            const branches = React.useMemo(() => {
                const branchSet = new Set([...DEFAULT_BRANCHES, ...invoices.map(i => i.branch).filter(Boolean)]);
                return Array.from(branchSet);
            }, [invoices]);

            // Every sales rep already used on an invoice — feeds the autocomplete suggestions.
            const salesReps = React.useMemo(() => {
                const set = new Set(invoices.map(i => (i.salesRep || '').trim()).filter(Boolean));
                return Array.from(set).sort((a, b) => a.localeCompare(b));
            }, [invoices]);

            const paymentMethods = React.useMemo(() => {
                const set = new Set(invoices.map(i => i.paymentMethod));
                return Array.from(set);
            }, [invoices]);

            const invoicePassesFilters = (inv, withDate) => {
                {
                    if (filters.branch !== 'ALL' && inv.branch !== filters.branch) {
                        return false;
                    }
                    if (filters.salesRep && filters.salesRep !== 'ALL') {
                        const rep = (inv.salesRep || '').trim();
                        if (filters.salesRep === 'UNASSIGNED' ? rep !== '' : rep !== filters.salesRep) {
                            return false;
                        }
                    }
                    if (filters.paymentMethod !== 'ALL' && inv.paymentMethod !== filters.paymentMethod) {
                        return false;
                    }
                    if (withDate && filters.dateFrom && inv.date < filters.dateFrom) {
                        return false;
                    }
                    if (withDate && filters.dateTo && inv.date > filters.dateTo) {
                        return false;
                    }
                    if (filters.cwtFilter === 'WITH_2307' && (!inv.cwt2307Rate || inv.cwt2307Rate === 0)) {
                        return false;
                    }
                    if (filters.cwtFilter === 'NO_2307' && inv.cwt2307Rate > 0) {
                        return false;
                    }
                    if (filters.vatFilter === 'WITH_VAT' && !(inv.taxRate > 0)) {
                        return false;
                    }
                    if (filters.vatFilter === 'NO_VAT' && inv.taxRate > 0) {
                        return false;
                    }
                    if (filters.returnFilter === 'WITH_RETURNS' && (!inv.returns || inv.returns.length === 0)) {
                        return false;
                    }
                    if (filters.returnFilter === 'NO_RETURNS' && inv.returns && inv.returns.length > 0) {
                        return false;
                    }
                    if (filters.search.trim() !== '') {
                        const term = filters.search.toLowerCase();
                        const s = (v) => String(v ?? '').toLowerCase();
                        const matchCust = s(inv.customer?.name).includes(term) ||
                                          s(inv.customer?.company).includes(term) ||
                                          s(inv.customer?.tin).includes(term);
                        const matchId = s(inv.id).includes(term);
                        const matchBranch = s(inv.branch).includes(term);
                        const matchRep = s(inv.salesRep).includes(term);
                        const matchItem = (inv.items || []).some(item =>
                            s(item.name).includes(term) ||
                            s(item.sku).includes(term) ||
                            s(item.category).includes(term)
                        );
                        return matchCust || matchId || matchBranch || matchRep || matchItem;
                    }

                    return true;
                }
            };

            const filteredInvoices = React.useMemo(
                () => enrichedInvoices.filter(inv => invoicePassesFilters(inv, true)),
                [enrichedInvoices, filters]
            );
            // Same filters but ignoring the date range — used to count refunds by refund date.
            const refundScopeInvoices = React.useMemo(
                () => enrichedInvoices.filter(inv => invoicePassesFilters(inv, false)),
                [enrichedInvoices, filters]
            );

            // Persists a new transaction to Supabase: ensures the branch
            // exists, inserts the invoice row, then resolves/creates a
            // product per line item and inserts the invoice_items rows.
            const handleSaveNewTransaction = async (newInv, appliedCreditNote) => {
                try {
                    const customerId = await upsertCustomerToSupabase(newInv.customer);
                    await insertInvoiceToSupabase(newInv, customerId);

                    // If the person chose to redeem an existing credit note against this new
                    // invoice, record that redemption now that the invoice exists. This is the
                    // ONLY place a credit note's balance is deducted from an invoice's total.
                    if (appliedCreditNote && appliedCreditNote.creditNoteId && appliedCreditNote.amount > 0) {
                        await applyCreditNoteToInvoice(
                            appliedCreditNote.creditNoteId,
                            newInv.id,
                            appliedCreditNote.amount,
                            newInv.date
                        );
                    }

                    await reloadInvoices();
                    await reloadCustomers();
                    setToastMessage(
                        appliedCreditNote && appliedCreditNote.amount > 0
                            ? `Purchase Invoice ${newInv.id} logged — ${formatCurrency(appliedCreditNote.amount)} credit note applied!`
                            : `Purchase Invoice ${newInv.id} logged for ${newInv.branch}!`
                    );
                } catch (err) {
                    console.error(err);
                    setToastMessage(`Error saving transaction: ${err.message}`);
                }
                setTimeout(() => setToastMessage(''), 4000);
            };

            // Redeems an already-issued credit note against an invoice that was already
            // logged (not the one being created right now). Same underlying operation as
            // the credit-note step inside handleSaveNewTransaction, just triggered later
            // from the InvoiceModal instead of at invoice-creation time.
            const handleApplyCreditNoteToExisting = async (invoiceId, creditNoteId, amount, dateStr) => {
                try {
                    await applyCreditNoteToInvoice(creditNoteId, invoiceId, amount, dateStr);
                    await reloadInvoices();
                    setToastMessage(`${formatCurrency(amount)} credit note applied to ${invoiceId}!`);
                } catch (err) {
                    console.error(err);
                    setToastMessage(`Error applying credit note: ${err.message}`);
                }
                setTimeout(() => setToastMessage(''), 4000);
            };

            // Persists one or more returned line items to Supabase (all sharing one
            // Credit Note No. when 2+ products are returned together): inserts each
            // return row, bumps returned_qty on its item, recomputes/updates the
            // invoice status, then refreshes and shows a single summary toast.
            const handleSaveReturn = async (invoiceId, returnLines) => {
                const lines = Array.isArray(returnLines) ? returnLines : [returnLines];
                try {
                    for (const line of lines) {
                        await insertReturnToSupabase(invoiceId, line.itemId, line.qty, line.record);
                    }

                    await reloadInvoices();
                    const totalQty = lines.reduce((s, l) => s + (parseInt(l.qty) || 0), 0);
                    const cnNo = lines[0]?.record?.creditNoteNo || '';
                    setToastMessage(
                        lines.length > 1
                            ? `Credit Memo ${cnNo} issued for ${lines.length} item(s), ${totalQty} unit(s) returned!`
                            : `Credit Memo ${cnNo} issued for ${totalQty} unit(s) returned!`
                    );
                } catch (err) {
                    console.error(err);
                    setToastMessage(`Error saving return: ${err.message}`);
                }
                setTimeout(() => setToastMessage(''), 4000);
            };

            // Admin-only: change whether BIR 2307 applies to an invoice. Throws on failure so the
            // editor can show the error inline instead of closing.
            const handleUpdateCwt2307 = async (invoiceId, rate, atcCode) => {
                if (profile?.role !== 'admin') throw new Error('Only admins can change BIR 2307.');
                await updateCwt2307InSupabase(invoiceId, rate, atcCode);
                await reloadInvoices();
                setToastMessage(rate > 0 ? `BIR 2307 (${rate}%) now applies to ${invoiceId}.` : `BIR 2307 removed from ${invoiceId}.`);
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleUpdateSalesRep = async (invoiceId, salesRep) => {
                try {
                    await updateSalesRepInSupabase(invoiceId, salesRep);
                    await reloadInvoices();
                    setToastMessage(salesRep ? `Sales rep for ${invoiceId} set to ${salesRep}.` : `Sales rep cleared for ${invoiceId}.`);
                } catch (err) {
                    console.error(err);
                    setToastMessage(`Error saving sales rep: ${err.message}`);
                }
                setTimeout(() => setToastMessage(''), 4000);
            };

            const handleResetFilters = () => {
                setFilters({ search: '', paymentMethod: 'ALL', cwtFilter: 'ALL', vatFilter: 'ALL', branch: 'ALL', salesRep: 'ALL', returnFilter: 'ALL', dateFrom: '', dateTo: '' });
            };

            const handleExportCSV = () => {
                logAppEvent('EXPORT_CSV', null, `Exported ${filteredInvoices.length} invoice(s) to CSV`);
                let csvRows = [];
                csvRows.push(['Invoice ID', 'Date', 'Branch Location', 'Sales Rep', 'Customer Name', 'Customer TIN', 'Payment Method', 'Item Name', 'SKU', 'Unit Price (PHP)', 'Qty Purchased', 'Qty Returned', 'Discount %', 'Net Line Total (PHP)', 'BIR 2307 Rate', 'BIR 2307 Amount (PHP)', 'Net Receivable (PHP)']);

                filteredInvoices.forEach(inv => {
                    const totals = calculateInvoiceTotals(inv);
                    inv.items.forEach(item => {
                        const net = calculateItemNet(item, true);
                        csvRows.push([
                            inv.id,
                            inv.date,
                            `"${inv.branch || 'Main Branch'}"`,
                            `"${inv.salesRep || ''}"`,
                            `"${inv.customer.name}"`,
                            `"${inv.customer.tin || 'N/A'}"`,
                            `"${inv.paymentMethod}"`,
                            `"${item.name}"`,
                            item.sku,
                            item.unitPrice,
                            item.qty,
                            item.returnedQty || 0,
                            item.discountPercent,
                            net.toFixed(2),
                            `${inv.cwt2307Rate || 0}%`,
                            totals.cwtAmount.toFixed(2),
                            totals.netPayable.toFixed(2)
                        ]);
                    });
                });

                const csvContent = 'data:text/csv;charset=utf-8,' + csvRows.map(e => e.join(',')).join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement('a');
                link.setAttribute('href', encodedUri);
                link.setAttribute('download', `ph_ledger_returns_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setToastMessage('Exported multi-branch purchase ledger with returns to CSV!');
                setTimeout(() => setToastMessage(''), 4000);
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
                    <Header
                        activeTab={activeTab}
                        setActiveTab={setActiveTab}
                        onOpenNewModal={() => setIsNewModalOpen(true)}
                        theme={theme}
                        onToggleTheme={toggleTheme}
                        userEmail={user?.email}
                        userRole={profile?.role}
                        onLogout={onLogout}
                        liveStatus={liveStatus}
                    />

                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {loadError && (
                            <div className="mb-6 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-sm flex items-center justify-between gap-3">
                                <span><i className="fas fa-triangle-exclamation mr-2"></i>Couldn't load data from Google Sheets: {loadError}</span>
                                <button
                                    onClick={reloadInvoices}
                                    className="bg-rose-600 hover:bg-rose-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition-colors"
                                >
                                    Retry
                                </button>
                            </div>
                        )}

                        {isLoading ? (
                            <div className="flex flex-col items-center justify-center py-24 text-slate-500 dark:text-slate-400">
                                <i className="fas fa-circle-notch fa-spin text-3xl mb-3 text-indigo-500"></i>
                                Loading purchase ledger from Google Sheets...
                            </div>
                        ) : (
                        <React.Fragment>
                        {activeTab !== 'creditnotes' && activeTab !== 'admin' && profile?.role === 'admin' && (
                            <React.Fragment>
                                <StatCards invoices={filteredInvoices} refundInvoices={refundScopeInvoices} activeBranch={filters.branch} dateFrom={filters.dateFrom} dateTo={filters.dateTo} />

                                <BranchBreakdown
                                    invoices={enrichedInvoices}
                                    branches={branches}
                                    activeBranch={filters.branch}
                                    onSelectBranch={(b) => setFilters({ ...filters, branch: b })}
                                />
                            </React.Fragment>
                        )}

                        {activeTab !== 'creditnotes' && activeTab !== 'admin' && (
                        <FilterBar
                            filters={filters}
                            setFilters={setFilters}
                            branches={branches}
                            paymentMethods={paymentMethods}
                            salesReps={salesReps}
                            onExportCSV={handleExportCSV}
                            onResetFilters={handleResetFilters}
                        />
                        )}

                        {tabMounted('ledger') && (
                        <div style={tabStyle('ledger')}>
                            <LedgerTable
                                invoices={filteredInvoices}
                                onSelectInvoice={(inv) => setSelectedInvoice(inv)}
                                onOpenReturnModal={(inv) => setReturnModalInvoice(inv)}
                            />
                        </div>
                        )}

                        {tabMounted('customers') && (
                        <div style={tabStyle('customers')}>
                            <CustomerLedgerView
                                invoices={filteredInvoices}
                                onSelectInvoice={(inv) => setSelectedInvoice(inv)}
                                creditNotesByEmail={creditNotesByEmail}
                                customersById={customersById}
                            />
                        </div>
                        )}

                        {tabMounted('creditnotes') && (
                        <div style={tabStyle('creditnotes')}>
                            <CreditNotesView
                                creditNotes={allCreditNotes}
                                invoices={enrichedInvoices}
                                onSelectInvoice={(inv) => setSelectedInvoice(inv)}
                            />
                        </div>
                        )}

                        {tabMounted('salesreps') && (
                        <div style={tabStyle('salesreps')}>
                            <SalesRepReportView
                                invoices={filteredInvoices}
                                onSelectInvoice={(inv) => setSelectedInvoice(inv)}
                                onPickRep={(rep) => setFilters({ ...filters, salesRep: rep })}
                            />
                        </div>
                        )}

                        {tabMounted('admin') && profile?.role === 'admin' && (
                        <div style={tabStyle('admin')}>
                            <AdminPanel
                                currentUserId={user?.id}
                                customers={dbCustomers}
                                onDataChanged={refreshAllData}
                            />
                        </div>
                        )}

                        {tabMounted('products') && (
                        <div style={tabStyle('products')}>
                            <ProductAnalyticsView
                                invoices={filteredInvoices}
                                products={products}
                                isAdmin={profile?.role === 'admin'}
                                onSrpSaved={() => fetchProductsFromSupabase().then(setProducts).catch(err => console.error(err))}
                            />
                        </div>
                        )}
                        </React.Fragment>
                        )}
                    </main>

                    <InvoiceModal
                        invoice={selectedInvoice ? (enrichedInvoices.find(inv => inv.id === selectedInvoice.id) || null) : null}
                        onClose={() => setSelectedInvoice(null)}
                        onOpenReturnModal={(inv) => {
                            setSelectedInvoice(null);
                            setReturnModalInvoice(inv);
                        }}
                        creditNotes={allCreditNotes}
                        onApplyCreditNote={handleApplyCreditNoteToExisting}
                        salesReps={salesReps}
                        onUpdateSalesRep={handleUpdateSalesRep}
                        isAdmin={profile?.role === 'admin'}
                        onUpdateCwt2307={handleUpdateCwt2307}
                        onEditInvoice={(id) => {
                            setSelectedInvoice(null);
                            setAdminEditInvoiceId(id);
                        }}
                    />

                    {adminEditInvoiceId && profile?.role === 'admin' && (
                        <InvoiceEditor
                            invoiceId={adminEditInvoiceId}
                            customers={dbCustomers}
                            notify={adminNotify}
                            onClose={() => setAdminEditInvoiceId(null)}
                            onRenamed={(newId) => setAdminEditInvoiceId(newId)}
                            onChanged={refreshAllData}
                        />
                    )}

                    <ProcessReturnModal
                        isOpen={!!returnModalInvoice}
                        invoice={returnModalInvoice}
                        onClose={() => setReturnModalInvoice(null)}
                        onSaveReturn={handleSaveReturn}
                    />

                    <NewTransactionModal
                        isOpen={isNewModalOpen}
                        onClose={() => setIsNewModalOpen(false)}
                        onSave={handleSaveNewTransaction}
                        branches={branches}
                        products={productCatalog}
                        customers={customers}
                        creditNotes={allCreditNotes}
                        salesReps={salesReps}
                    />

                    <Toast
                        message={toastMessage}
                        type="success"
                        onClose={() => setToastMessage('')}
                    />

                    <footer className="no-print bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-600 dark:text-slate-500">
                        Infinite CRM &copy; {new Date().getFullYear()} &bull; Multi-Branch Purchase Ledger, BIR Form 2307 & Item Returns Tracker
                    </footer>
                </div>
            );
        };

        // Wraps the whole app: shows the Login screen until there's a Supabase
        // session, then loads that user's profile (role) and renders App.
        // Records non-row events (sign-in, CSV export, print) in the admin Activity Log.
        // Fire-and-forget: a logging failure must never get in the user's way.
        const logAppEvent = (action, record, summary) => {
            try {
                Promise.resolve(sb.rpc('log_event', { p_action: action, p_record: record || null, p_summary: summary || null }))
                    .then((res) => { if (res && res.error) console.warn('Activity log:', res.error.message); })
                    .catch(() => {});
            } catch (_) { /* ignore */ }
        };

        const AuthGate = () => {
            const [session, setSession] = React.useState(undefined); // undefined = still checking, null = signed out
            const [profile, setProfile] = React.useState(null);
            const [profileError, setProfileError] = React.useState('');

            React.useEffect(() => {
                sb.auth.getSession().then(({ data }) => setSession(data.session || null));
                const { data: listener } = sb.auth.onAuthStateChange((_event, newSession) => {
                    setSession(newSession || null);
                });
                return () => listener.subscription.unsubscribe();
            }, []);

            React.useEffect(() => {
                if (session === undefined) return;
                if (session === null) { setProfile(null); return; }
                fetchProfile(session.user.id)
                    .then((p) => {
                        setProfile(p);
                        try {
                            const key = `lfLoginLogged:${session.user.id}`;
                            if (!sessionStorage.getItem(key)) {
                                sessionStorage.setItem(key, '1');
                                logAppEvent('LOGIN', null, 'Signed in');
                            }
                        } catch (_) { /* ignore */ }
                    })
                    .catch(err => setProfileError(err.message || 'Could not load your profile.'));
            }, [session]);

            const handleLogout = async () => {
                try { sessionStorage.removeItem(`lfLoginLogged:${session.user.id}`); } catch (_) { /* ignore */ }
                await sb.auth.signOut();
                setSession(null);
                setProfile(null);
            };

            if (session === undefined) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400">
                        <i className="fas fa-circle-notch fa-spin text-2xl"></i>
                    </div>
                );
            }

            if (!session) {
                return <Login />;
            }

            if (!profile) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-3 bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 px-4 text-center">
                        {profileError ? (
                            <React.Fragment>
                                <i className="fas fa-triangle-exclamation text-2xl text-rose-500"></i>
                                <p className="text-sm">{profileError}</p>
                                <button onClick={handleLogout} className="text-xs text-indigo-600 dark:text-indigo-400 underline">Log out</button>
                            </React.Fragment>
                        ) : (
                            <i className="fas fa-circle-notch fa-spin text-2xl"></i>
                        )}
                    </div>
                );
            }

            return <App user={session.user} profile={profile} onLogout={handleLogout} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthGate />);
    </script>
</body>
</html>
